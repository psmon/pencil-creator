<body>

<div class="brand">

</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.161.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* == 좌표계: Blender(x,y,z) → Three(x, z, -y) ================= */
const BL = (x, y, z) => new THREE.Vector3(x, z, -y);

/* 시드 랜덤 (블렌더 배치 재현용) */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe3bd8f, 420, 1350);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.5, 4000);

/* == 하늘 돔 (석양 그라데이션) ================================ */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { },
  vertexShader: `varying vec3 vP; void main(){ vP = position;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `varying vec3 vP;
    void main(){
      float h = normalize(vP).y;
      vec3 top = vec3(0.45, 0.55, 0.72);
      vec3 mid = vec3(0.82, 0.80, 0.78);
      vec3 glo = vec3(0.98, 0.72, 0.42);
      vec3 c = h > 0.25 ? mix(mid, top, smoothstep(0.25, 0.8, h))
                        : mix(glo, mid, smoothstep(-0.02, 0.25, h));
      /* 서쪽(-x) 지평선 강조 글로우 */
      float west = smoothstep(0.2, 1.0, -normalize(vP).x) * smoothstep(0.3, -0.05, h);
      c = mix(c, vec3(1.0, 0.62, 0.28), west * 0.55);
      gl_FragColor = vec4(c, 1.0);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(1800, 32, 16), skyMat));

/* == 라이팅 ==================================================== */
const sun = new THREE.DirectionalLight(0xffa055, 3.2);
sun.position.set(-320, 130, 180);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = 320;
Object.assign(sun.shadow.camera, { left: -sc, right: sc, top: sc, bottom: -sc, far: 1200 });
sun.shadow.bias = -0.0004;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbdc7de, 0x4a3b28, 0.75));
const fill = new THREE.DirectionalLight(0xffd9a8, 0.5);
fill.position.set(200, 90, 300);
scene.add(fill);

/* == 머티리얼 ================================================== */
const M = {
  grass: new THREE.MeshStandardMaterial({ color: 0x51683a, roughness: 1 }),
  road:  new THREE.MeshStandardMaterial({ color: 0x4c4744, roughness: .95 }),
  path:  new THREE.MeshStandardMaterial({ color: 0x9a8a74, roughness: .9 }),
  crown: new THREE.MeshStandardMaterial({ color: 0xcbb494, roughness: .5 }),
  podium:new THREE.MeshStandardMaterial({ color: 0xb59a76, roughness: .6 }),
  glass: new THREE.MeshStandardMaterial({ color: 0xffc27a, roughness: .15, metalness: .4,
          emissive: 0xff9a45, emissiveIntensity: .35 }),
  roof:  new THREE.MeshStandardMaterial({ color: 0x3a3a40, roughness: .4, metalness: .6 }),
  mtn:   new THREE.MeshStandardMaterial({ color: 0x6e5d78, roughness: 1 }),
  trunk: new THREE.MeshStandardMaterial({ color: 0x6b4a2e, roughness: 1 }),
  leaf:  new THREE.MeshStandardMaterial({ color: 0x4f7034, roughness: 1 }),
  bush:  new THREE.MeshStandardMaterial({ color: 0x3c5c2a, roughness: 1 }),
  water: new THREE.MeshStandardMaterial({ color: 0x2e5a66, roughness: .05, metalness: .3 }),
  tire:  new THREE.MeshStandardMaterial({ color: 0x151515, roughness: .9 }),
  carGl: new THREE.MeshStandardMaterial({ color: 0x0e1420, roughness: .1, metalness: .5 }),
  skin:  new THREE.MeshStandardMaterial({ color: 0xc98f6b, roughness: .7 }),
  lampG: new THREE.MeshStandardMaterial({ color: 0xfff1cf, emissive: 0xffc878, emissiveIntensity: 1.4 }),
};
M.roadV = M.road.clone();   // 세로 도로용 (실사 텍스처 repeat 방향 분리)

/* == 실사 텍스처 스왑 레지스트리 ================================ */
/* gpt-image-2로 생성한 seamless 텍스처를 머티리얼에 ON/OFF 스왑 */
const SWAPS = [];
function regSwap(mat, key, ru, rv){
  SWAPS.push({ mat, key, ru, rv, realTex: null,
    off: { map: mat.map || null, color: mat.color.getHex() } });
}

/* 파사드 캔버스 텍스처: 골든 석재 벽 + 딥글라스 창 그리드 */
function facadeTexture(cols, rows, wallHex, seed){
  const rnd = mulberry32(seed);
  const cw = 28, ch = 28;
  const cv = document.createElement('canvas');
  cv.width = cols * cw; cv.height = rows * ch;
  const g = cv.getContext('2d');
  g.fillStyle = wallHex; g.fillRect(0, 0, cv.width, cv.height);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const v = rnd();
      let col;
      if (v > 0.96)      col = `rgb(${200+rnd()*40|0}, ${140+rnd()*30|0}, ${70+rnd()*20|0})`; // 석양 반사 글린트
      else if (v > 0.90) col = 'rgb(96, 84, 66)';   // 흐린 반사
      else {
        const d = 22 + rnd()*18 | 0;
        col = `rgb(${d}, ${d+6}, ${d+14})`;          // 딥 글라스
      }
      g.fillStyle = col;
      g.fillRect(c*cw + cw*0.18, r*ch + ch*0.24, cw*0.64, ch*0.5);
    }
  }
  const tx = new THREE.CanvasTexture(cv);
  tx.colorSpace = THREE.SRGBColorSpace;
  tx.anisotropy = 8;
  return tx;
}
function facadeMats(cols, rows, wallHex, wallColor, seed, realKey){
  const tex = facadeTexture(cols, rows, wallHex, seed);
  const side = new THREE.MeshStandardMaterial({ map: tex, roughness: .55, metalness: .12 });
  side.userData.repYReal = rows / 3;   // 건설 v2 크롭용 기준 repeat
  const top  = new THREE.MeshStandardMaterial({ color: wallColor, roughness: .6 });
  if (realKey) regSwap(side, realKey, cols/3, rows/3);   // 실사 타일 = 3x3 창 패턴
  return [side, side, top, top, side, side];
}

const group = new THREE.Group();
scene.add(group);
function box(w, h, d, mat, pos, ry = 0, shadow = true){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.copy(pos); m.rotation.y = ry;
  m.castShadow = shadow; m.receiveShadow = true;
  group.add(m); return m;
}

/* == 지면/도로/광장 =========================================== */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1700, 1700), M.grass);
ground.rotation.x = -Math.PI/2; ground.position.copy(BL(0, 0, 0));
ground.receiveShadow = true; group.add(ground);
box(900, .3, 14, M.road, BL(0, -70, .15), 0, false);
box(20, .28, 600, M.roadV, BL(-110, 40, .14), 0, false);
box(20, .28, 600, M.roadV, BL(110, 40, .14), 0, false);
box(380, .26, 120, M.path, BL(0, 8, .13), 0, false);
box(10, .3, 80, M.path, BL(0, -45, .15), 0, false);

/* == 건설 타임랩스용 라이저 등록부 ============================= */
/* 구조물 파트를 등록하면 ⑩ 모드에서 지하로부터 솟아오른다 */
const RISERS = [];                  // {parts:[{obj,y0}], H, delay, dur}
function newRiser(H, delay, dur){
  const r = { parts: [], H, delay, dur };
  RISERS.push(r); return r;
}
function riseAdd(riser, obj){
  if (riser) riser.parts.push({ obj, y0: obj.position.y });
}

/* == 건설 v2 (층별 시공) 그로워 등록부 ========================= */
/* 바닥을 고정한 채 scale.y + 텍스처 repeat 크롭으로 아래→위 시공.
   tex: 파사드 박스(창문 비율 유지 크롭) / solid: 단색 수직재
   cap: 완공 직전 등장(크라운/지붕) / attach: 층 도달 시 등장(인테리어 등) */
const GROWERS = [];
const workLightGeo = new THREE.BoxGeometry(1, 1, 1);
function newGrower(H, delay, dur, cx, cz, fw, fd){
  const wlMat = new THREE.MeshStandardMaterial({
    color: 0x331a05, emissive: 0xffa030, emissiveIntensity: 4 });
  const wl = new THREE.Mesh(workLightGeo, wlMat);
  wl.scale.set(fw + 2.5, 1.1, fd + 2.5);
  wl.position.set(cx, 0, cz);
  wl.visible = false;
  group.add(wl);
  const g = { H, delay, dur, tex: [], solids: [], caps: [], attach: [], wl, wlMat };
  GROWERS.push(g); return g;
}
const growTex    = (g, mesh, h) => g.tex.push({ mesh, h, baseY: mesh.position.y - h/2 });
const growSolid  = (g, mesh, h) => g.solids.push({ mesh, h, baseY: mesh.position.y - h/2 });
const growCap    = (g, obj) => g.caps.push(obj);
const growAttach = (g, obj, topY) => g.attach.push({ obj, topY });

/* == 메인 타워 5개동 =========================================== */
const TOWERS = [
  [-75, 10, 165, '#8d7a5e', 0xa08a68, 11],
  [-45, -5, 215, '#9b8a70', 0xb09a78, 22],
  [ -5,-15, 235, '#9b8a70', 0xb09a78, 33],
  [ 35, -5, 205, '#9b8a70', 0xb09a78, 44],
  [ 70, 10, 180, '#8d7a5e', 0xa08a68, 55],
];
/* 착공 순서: 랜드마크(T3) → T2 → T4 → T1 → T5 */
const TOWER_TIMING = [[9, 12], [5, 13], [2, 14], [7, 13], [11, 12]];
const towerRisers = [];
const towerGrowers = [];
TOWERS.forEach(([x, y, h, wallHex, wallCol, seed], i) => {
  const riser = newRiser(h + 9, TOWER_TIMING[i][0], TOWER_TIMING[i][1]);
  towerRisers.push(riser);
  const grower = newGrower(h, TOWER_TIMING[i][0], TOWER_TIMING[i][1], x, -y, 24, 18);
  towerGrowers.push(grower);
  const floors = Math.round(h / 3.6);
  const t = new THREE.Mesh(new THREE.BoxGeometry(24, h, 18), facadeMats(7, floors, wallHex, wallCol, seed, 'facadeMain'));
  t.position.copy(BL(x, y, h/2)); t.castShadow = t.receiveShadow = true;
  group.add(t); riseAdd(riser, t); growTex(grower, t, h);
  const rib1 = box(1.2, h*0.995, 10, M.crown, BL(x-12, y, h/2));
  const rib2 = box(1.2, h*0.995, 10, M.crown, BL(x+12, y, h/2));
  riseAdd(riser, rib1); riseAdd(riser, rib2);
  growSolid(grower, rib1, h*0.995); growSolid(grower, rib2, h*0.995);
  const cr1 = box(22, 5, 15.3, M.crown, BL(x, y, h+2.5));
  const cr2 = box(13.2, 4, 9.9, M.crown, BL(x, y, h+6.5));
  riseAdd(riser, cr1); riseAdd(riser, cr2);
  growCap(grower, cr1); growCap(grower, cr2);
});

/* == 포디움 상가 =============================================== */
[[-60,35,55,30],[0,40,70,35],[60,35,55,30]].forEach(([px, py, pw, pd], i) => {
  const riser = newRiser(16, 24 + i*1.2, 5);
  const grower = newGrower(14, 24 + i*1.2, 5, px, -py, pw, pd);
  const base = box(pw, 12, pd, M.podium, BL(px, py, 6));
  const gl = box(pw*0.85, 9, 2.5, M.glass, BL(px, py - pd/2 + 1, 5));
  riseAdd(riser, base); riseAdd(riser, gl);
  growSolid(grower, base, 12); growSolid(grower, gl, 9);
  const roof = box(pw*1.06, 2, pd*1.1, M.roof, BL(px, py, 13.5));
  roof.rotation.x = 0.07;
  riseAdd(riser, roof); growCap(grower, roof);
});

/* == 배경 아파트 클러스터 ====================================== */
{
  const rnd = mulberry32(42);
  const uni = (a,b)=>a+(b-a)*rnd();
  [[-160,60],[-135,90],[-170,120],[150,60],[135,95],[175,115],[200,80],[-110,150],[110,150],[0,180],[-50,170],[55,175]].forEach(([bx, by], i) => {
    const h = uni(60,100), w = uni(30,45);
    const riser = newRiser(h + 4, 15 + i*0.7, 8);
    const grower = newGrower(h, 15 + i*0.7, 8, bx, -by, w, 14);
    const fl = Math.round(h/3.4);
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, 14), facadeMats(9, fl, '#7d6f5c', 0x8f8070, (bx*7^by*13)>>>0, 'facadeBg'));
    b.position.copy(BL(bx, by, h/2)); b.castShadow = b.receiveShadow = true;
    group.add(b); riseAdd(riser, b); growTex(grower, b, h);
    const bt = box(w*0.9, 3, 12, M.crown, BL(bx, by, h+1.5));
    riseAdd(riser, bt); growCap(grower, bt);
  });
}

/* == 원경: 산 + 도시 스카이라인 ================================ */
for (const [mx,my,mw,mh] of [[-350,460,500,90],[0,500,600,120],[330,470,450,80],[-120,480,400,70],[180,490,380,100]]) {
  const c = new THREE.Mesh(new THREE.ConeGeometry(mw, mh, 6, 1), M.mtn);
  c.position.copy(BL(mx, my, mh/2 - 5)); c.scale.set(1, 1, 0.45);
  group.add(c);
}

/* == 나무 (InstancedMesh) ====================================== */
const treeSpots = [];
{
  const rnd = mulberry32(7);
  const uni = (a,b)=>a+(b-a)*rnd();
  for (let i=0;i<45;i++) treeSpots.push([uni(-170,170), uni(-58,-25), uni(.8,1.4)]);
  for (let x=-160;x<170;x+=22) treeSpots.push([x, -62, uni(.8,1.4)]);
  for (let i=0;i<15;i++) treeSpots.push([uni(-90,90), uni(28,55), uni(.8,1.4)]);
  for (let a=0;a<360;a+=40) treeSpots.push([-120+30*Math.cos(a*Math.PI/180)*1.3, -40+30*Math.sin(a*Math.PI/180)*.75, uni(.9,1.3)]);
}
{
  const n = treeSpots.length;
  const trunkI = new THREE.InstancedMesh(new THREE.CylinderGeometry(.4,.5,4,7), M.trunk, n);
  const crownI = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(2.8,1), M.leaf, n);
  const d = new THREE.Object3D();
  const col = new THREE.Color();
  treeSpots.forEach(([x,y,s], i) => {
    d.position.copy(BL(x, y, 2*s)); d.scale.setScalar(s); d.updateMatrix();
    trunkI.setMatrixAt(i, d.matrix);
    d.position.copy(BL(x, y, 5.5*s)); d.updateMatrix();
    crownI.setMatrixAt(i, d.matrix);
    crownI.setColorAt(i, col.setHSL(.26, .42, .3 + (i%5)*.025));
  });
  trunkI.castShadow = crownI.castShadow = true;
  group.add(trunkI, crownI);
}

/* == 관목/화단/연못 ============================================ */
{
  const rnd = mulberry32(55);
  const uni = (a,b)=>a+(b-a)*rnd();
  const bushG = new THREE.IcosahedronGeometry(1, 1);
  const bushI = new THREE.InstancedMesh(bushG, M.bush, 50);
  const d = new THREE.Object3D();
  for (let i=0;i<50;i++){
    const z = rnd() < .5 ? [uni(-175,175), uni(-58,-22)] : [uni(-95,95), uni(4,20)];
    const s = uni(.8,1.8);
    d.position.copy(BL(z[0], z[1], .5*s)); d.scale.set(s, s*.55, s); d.updateMatrix();
    bushI.setMatrixAt(i, d.matrix);
  }
  bushI.castShadow = true; group.add(bushI);

  const fr = new THREE.MeshStandardMaterial({ color: 0xa62a26, roughness: .8 });

{

                new THREE.MeshStandardMaterial({ roughness: .85 }), PEOPLE_N);

    else if (i < 95) { x = uni(-8,8);     y = uni(-48,-18); }
    else { x = [uni(-55,-30), uni(-15,20), uni(30,55)][i%3]; y = uni(6,18); }
    people.push({ x, y, s: uni(.9,1.1),
      vx: (rnd()-.5)*2.2, vy: (rnd()-.5)*1.2,
      x0: x, y0: y, ph: rnd()*Math.PI*2 });
    bodyI.setColorAt(i, col.setHex(cloth[i % cloth.length]));
  }

  group.add(bodyI, headI);

}
const pDummy = new THREE.Object3D();
function updatePeople(t){
  for (let i=0;i<PEOPLE_N;i++){
    const p = people[i];
    const wx = p.x0 + Math.sin(t*.14 + p.ph) * p.vx * 6;
    const wy = p.y0 + Math.cos(t*.11 + p.ph) * p.vy * 6;
    const bob = Math.abs(Math.sin(t*2.2 + p.ph)) * .06;
    pDummy.position.copy(BL(wx, wy, .675*p.s + bob));
    pDummy.scale.setScalar(p.s); pDummy.updateMatrix();
    peopleBody.setMatrixAt(i, pDummy.matrix);
    pDummy.position.copy(BL(wx, wy, 1.52*p.s + bob)); pDummy.updateMatrix();
    peopleHead.setMatrixAt(i, pDummy.matrix);
  }

}

function buildUnit(key){
  const u = UNITS[key];
  const { cx, front, z0, W, D, H } = u;
  const x0 = cx - W/2;
  const riser = towerRisers[TOWER_OF[key]];
  const grower = towerGrowers[TOWER_OF[key]];
  const unitTop = z0 + H + 0.3;   // 이 층까지 시공되면 인테리어 등장
  // 로컬(lx,ly,lz중심) → 월드: three (x0+lx, z0+lz, -(front+ly)), 크기 (sx, sz, sy)
  const put = (lx, ly, lz, sx, sy, sz, matKey) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sz, sy), IMAT[matKey]);
    m.position.set(x0 + lx, z0 + lz, -(front + ly));
    m.receiveShadow = true;
    group.add(m); riseAdd(riser, m); growAttach(grower, m, unitTop); return m;
  };
  // 셸
  put(W/2, D/2, .075, W, D, .15, u.floor);            // 바닥
  put(W/2, D/2, H+.06, W, D, .12, 'wallw');           // 천장
  put(W/2, D-.075, H/2, W, .15, H, 'wallw');          // 뒷벽
  put(.075, D/2, H/2, .15, D, H, 'wallw');            // 좌벽
  put(W-.075, D/2, H/2, .15, D, H, 'wallw');          // 우벽

  put(W/2, -2.16, .55, W, .08, 1.1, 'iglass');        // 난간
  put(W/2, .03, H/2, W, .06, H, 'iglass');            // 전면 유리
  put(W/3, .03, H/2, .12, .12, H, 'counter');
  put(W*2/3, .03, H/2, .12, .12, H, 'counter');
  // 가구
  for (const f of FURN[key]) put(...f);
  // 실내 조명
  for (const ly of [D*.28, D*.72]) {

}

/* 인테리어 투어 카메라: 외부 어프로치 → 발코니 관통 진입 → 실내 룩어라운드 */
function tourFn(key){
  const u = UNITS[key];
  const { cx, front, z0, W, D, H } = u;
  const zFace = -front;                    // 파사드 평면 (three z)
  const eye = z0 + 1.6;
  const P0 = new THREE.Vector3(cx + 38, z0 + 20, zFace + 95);   // 원경 어프로치 시점
  const P1 = new THREE.Vector3(cx, eye + .1, zFace + 7.5);      // 발코니 앞
  const P2 = new THREE.Vector3(cx, eye, zFace - D * .45);       // 실내 안착점 (중앙부)
  const ease = s => (1 - Math.cos(Math.min(Math.max(s,0),1) * Math.PI)) / 2;
  const A = 6, B = 2.5;
  return (t) => {
    const pos = new THREE.Vector3(), tgt = new THREE.Vector3();
    let fov = 42;
    if (t < A) {                                        // 어프로치
      pos.lerpVectors(P0, P1, ease(t / A));
      tgt.set(cx, eye, zFace - 2);
    } else if (t < A + B) {                             // 유리 관통 진입
      const s = ease((t - A) / B);
      pos.lerpVectors(P1, P2, s);
      tgt.set(cx, eye - .15, zFace - D * .75);
      fov = 42 + s * 20;
    } else {                                            // 실내 360° 룩어라운드
      const tr = t - A - B;
      const yaw = tr * .3;                               // 약 21초에 한 바퀴
      const pitch = Math.sin(tr * .21) * .4 - .12;
      pos.copy(P2);
      pos.x += Math.sin(tr * .18) * Math.min(W * .06, 1.0);
      pos.y += Math.sin(tr * .27) * .1;
      tgt.set(
        pos.x + Math.sin(yaw) * 7,
        pos.y + pitch,
        pos.z - Math.cos(yaw) * 7
      );
      fov = 62;
    }
    return [pos, tgt, fov];
  };
}

    fn: (t) => {
      const k = (Math.sin(t*.12 - Math.PI/2) + 1) / 2;   // 0→1 슬로우 푸시인 왕복
      const pos = BL(5, -470 + k*85, 42 - k*10);
      const tgt = BL(0, -10, 98 - k*8);
      return [pos, tgt];
    } },
  { name: '② 드론 선회',
    desc: '<b>드론 부감 선회</b> — 단지 상공을 크게 도는 에어리얼 오빗',
    fn: (t) => {
      const a = t * .105;
      const pos = new THREE.Vector3(Math.sin(a)*360, 255 + Math.sin(t*.3)*12, Math.cos(a)*360 + 10);
      return [pos, BL(0, 5, 70)];
    } },
  { name: '③ 공원 산책',
    desc: '<b>공원 눈높이 워크스루</b> — 산책로를 따라 걷는 시점, 인파와 차량 사이로',
    fn: (t) => {
      const x = -110 + ((t*7) % 220);
      const pos = BL(x, -95, 3.2 + Math.sin(t*1.8)*.12);
      const tgt = BL(x*.35, -18, 16);
      return [pos, tgt];
    } },
  { name: '④ 타워 클라임',
    desc: '<b>랜드마크 수직 상승</b> — 235m 최고층 타워를 나선으로 감아 오르는 샷',
    fn: (t) => {
      const climb = (t*.055) % 1;
      const h = 12 + climb*250;
      const a = t*.28;
      const pos = new THREE.Vector3(-5 + Math.sin(a)*85, h, 15 + Math.cos(a)*85);
      const tgt = new THREE.Vector3(-5, Math.min(h + 22, 245), 15);
      return [pos, tgt];
    } },
  { name: '⑤ 선셋 플라이바이',
    desc: '<b>석양 측면 플라이바이</b> — 황금빛을 스치며 단지를 가로지르는 시네마틱 스윕',
    fn: (t) => {
      const k = (Math.sin(t*.09 - Math.PI/2) + 1) / 2;
      const pos = new THREE.Vector3(-430 + k*860, 95 + Math.sin(k*Math.PI)*55, 320 - k*90);
      return [pos, BL(0, 0, 95)];
    } },
  { name: '⑥ 20평 투어',
    desc: '<b>인테리어 투어 — 20평 (101동 10층)</b> — LDK + 침실 · 콤팩트 신혼 평형. 발코니로 진입해 실내를 둘러봅니다',
    fn: tourFn('u20') },
  { name: '⑦ 30평 투어',
    desc: '<b>인테리어 투어 — 30평 (102동 15층)</b> — 국민평형 84㎡ · 거실 미디어월 + 아일랜드 주방 + 침실 2',
    fn: tourFn('u30') },
  { name: '⑧ 40평 투어',
    desc: '<b>인테리어 투어 — 40평 (104동 20층)</b> — L형 카우치 거실 + 다이닝 + 드레스룸 딸린 마스터룸',
    fn: tourFn('u40') },
  { name: '⑨ 80평 펜트하우스 투어',
    desc: '<b>인테리어 투어 — 80평 펜트하우스 (103동 최상층)</b> — 대리석 그랜드 리빙 + 8인 다이닝 + 골드 마스터 스위트 + 샹들리에',
    fn: tourFn('u80') },
  { name: '⑩ 건설 타임랩스',
    desc: '<b>건설 타임랩스</b> — 빈 부지에서 랜드마크동부터 순차 착공, 단지가 솟아오르는 42초 시퀀스 (자동 반복)',
    fn: (t) => {
      const tc = t % CONSTRUCT_CYC;
      const k = Math.min(tc / 30, 1);
      const e = (1 - Math.cos(k * Math.PI)) / 2;
      const pos = new THREE.Vector3(
        115 - 260 * e + Math.sin(t * .1) * 8,
        10 + 200 * e,
        298 + 50 * e
      );
      const tgt = new THREE.Vector3(0, 12 + 110 * e, 15);
      return [pos, tgt, 40];
    } },
  { name: '⑪ 건설 v2 · 층별 시공',
    desc: '<b>건설 v2 — 층별 시공</b> — 바닥부터 한 층씩 골조가 올라오고 최상층 작업등이 반짝이는 리얼 타임랩스. 완공 층부터 인테리어 입주',
    fn: (t) => {
      const tc = t % CONSTRUCT_CYC;
      const k = Math.min(tc / 32, 1);
      const e = (1 - Math.cos(k * Math.PI)) / 2;
      const a = -.55 + e * .9 + Math.sin(t * .07) * .06;
      const r = 330 - e * 60;
      const pos = new THREE.Vector3(Math.sin(a) * r, 14 + 190 * e, Math.cos(a) * r + 30);
      const tgt = new THREE.Vector3(0, 10 + 112 * e, 12);
      return [pos, tgt, 40];
    } },
];
const CONSTRUCT_IDX = 9, CONSTRUCT_CYC = 42;
const CONSTRUCT2_IDX = 10;

/* 건설 v2 상태 적용: 층별 시공 (바닥 고정 크롭 성장) */
let construct2Dirty = false;
function updateConstructionV2(tc, tAbs){
  const active = Number.isFinite(tc);
  if (!active && !construct2Dirty) return;
  for (const g of GROWERS) {
    const raw = Math.min(Math.max((tc - g.delay) / g.dur, 0), 1);
    const p = active ? raw * raw * (3 - 2 * raw) : 1;
    const built = g.H * p;
    for (const s of g.tex) {                      // 파사드: 크롭 성장 (창문 비율 유지)
      const vis = p > 0.015;
      s.mesh.visible = vis;
      const sy = Math.max(p, 0.015);
      s.mesh.scale.y = sy;
      s.mesh.position.y = s.baseY + s.h * sy / 2;
      const mat = Array.isArray(s.mesh.material) ? s.mesh.material[0] : s.mesh.material;
      if (mat.map) {
        const baseRep = mat.map.isCanvasTexture ? 1 : (mat.userData.repYReal || 1);
        mat.map.repeat.y = baseRep * sy;
      }
    }
    for (const s of g.solids) {                   // 단색 수직재: 단순 성장
      const sy = Math.max(p, 0.015);
      s.mesh.visible = p > 0.015;
      s.mesh.scale.y = sy;
      s.mesh.position.y = s.baseY + s.h * sy / 2;
    }
    for (const c of g.caps) c.visible = !active || p > 0.985;   // 크라운/지붕: 완공 직전
    for (const at of g.attach) at.obj.visible = !active || built >= at.topY;  // 인테리어: 층 도달
    // 최상층 작업등
    const working = active && p > 0.015 && p < 0.99;
    g.wl.visible = working;
    if (working) {
      g.wl.position.y = built + 0.8;
      g.wlMat.emissiveIntensity = 3.2 + Math.sin(tAbs * 11 + g.delay * 7) * 1.6;
    }
  }
  construct2Dirty = active;
}

/* 건설 상태 적용: tc(초) 시점의 각 구조물 상승 오프셋 */
let constructionDirty = false;
function updateConstruction(tc){
  const active = Number.isFinite(tc);
  if (!active && !constructionDirty) return;
  for (const r of RISERS) {
    const p = Math.min(Math.max((tc - r.delay) / r.dur, 0), 1);
    const e2 = active ? p * p * (3 - 2 * p) : 1;
    const dy = -r.H * (1 - e2);
    for (const pt of r.parts) pt.obj.position.y = pt.y0 + dy;
  }
  constructionDirty = active;
}

let modeIdx = 0, prevIdx = 0, blend = 1;
let tMode = 0, tPrev = 0;
const clock = new THREE.Clock();

const capEl = document.getElementById('caption');
const btns = [...document.querySelectorAll('.panel button')];
function setMode(i){
  if (i === modeIdx) return;
  prevIdx = modeIdx; tPrev = tMode;
  modeIdx = i; tMode = 0; blend = 0;
  btns.forEach(b => b.classList.toggle('on', +b.dataset.mode === i));
  showCaption(MODES[i].desc);
}
let capTimer;
function showCaption(html){
  capEl.innerHTML = html;
  capEl.classList.add('show');
  clearTimeout(capTimer);
  capTimer = setTimeout(()=>capEl.classList.remove('show'), 4200);
}
btns.forEach(b => b.addEventListener('click', () => setMode(+b.dataset.mode)));
btns[0].classList.add('on');
showCaption(MODES[0].desc);

addEventListener('keydown', e => {
  const n = parseInt(e.key);
  if (n >= 1 && n <= 9) setMode(n-1);
  if (e.key === '0') setMode(9);
  if (e.key === '-') setMode(10);
});

const _p1 = new THREE.Vector3(), _t1 = new THREE.Vector3();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;
  tMode += dt; tPrev += dt;
  if (blend < 1) blend = Math.min(1, blend + dt / 1.6);
  const e = blend<1 ? (1 - Math.cos(blend*Math.PI))/2 : 1;   // easeInOut

  updateConstruction(
    modeIdx === CONSTRUCT_IDX ? tMode % CONSTRUCT_CYC :
    (blend < 1 && prevIdx === CONSTRUCT_IDX ? tPrev % CONSTRUCT_CYC : Infinity)
  );
  updateConstructionV2(
    modeIdx === CONSTRUCT2_IDX ? tMode % CONSTRUCT_CYC :
    (blend < 1 && prevIdx === CONSTRUCT2_IDX ? tPrev % CONSTRUCT_CYC : Infinity), t
  );

  const [pA, tA, fA = 38] = MODES[prevIdx].fn(tPrev);
  const [pB, tB, fB = 38] = MODES[modeIdx].fn(tMode);
  _p1.lerpVectors(pA, pB, e); _t1.lerpVectors(tA, tB, e);
  camera.position.copy(_p1);
  camera.lookAt(_t1);
  const fv = fA + (fB - fA) * e;
  if (Math.abs(camera.fov - fv) > .01) { camera.fov = fv; camera.updateProjectionMatrix(); }

  updatePeople(t);
  updateCars(dt);
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
