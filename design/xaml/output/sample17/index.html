</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.161.0/build/three.module.js" } }

<script type="module">
import * as THREE from 'three';

/* == 좌표계: Blender(x,y,z) → Three(x, z, -y) ================= */
const BL = (x, y, z) => new THREE.Vector3(x, z, -y);

/* 시드 랜덤 (블렌더 배치 재현용) */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe3bd8f, 420, 1350);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.5, 4000);

/* == 하늘 돔 (석양 그라데이션) ================================ */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { },
  vertexShader: `varying vec3 vP; void main(){ vP = position;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `varying vec3 vP;
    void main(){
      float h = normalize(vP).y;
      vec3 top = vec3(0.45, 0.55, 0.72);
      vec3 mid = vec3(0.82, 0.80, 0.78);
      vec3 glo = vec3(0.98, 0.72, 0.42);
      vec3 c = h > 0.25 ? mix(mid, top, smoothstep(0.25, 0.8, h))
                        : mix(glo, mid, smoothstep(-0.02, 0.25, h));
      /* 서쪽(-x) 지평선 강조 글로우 */
      float west = smoothstep(0.2, 1.0, -normalize(vP).x) * smoothstep(0.3, -0.05, h);
      c = mix(c, vec3(1.0, 0.62, 0.28), west * 0.55);
      gl_FragColor = vec4(c, 1.0);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(1800, 32, 16), skyMat));

/* == 라이팅 ==================================================== */
const sun = new THREE.DirectionalLight(0xffa055, 3.2);
sun.position.set(-320, 130, 180);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = 320;
Object.assign(sun.shadow.camera, { left: -sc, right: sc, top: sc, bottom: -sc, far: 1200 });
sun.shadow.bias = -0.0004;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbdc7de, 0x4a3b28, 0.75));
const fill = new THREE.DirectionalLight(0xffd9a8, 0.5);
fill.position.set(200, 90, 300);
scene.add(fill);

/* == 머티리얼 ================================================== */
const M = {
  grass: new THREE.MeshStandardMaterial({ color: 0x51683a, roughness: 1 }),
  road:  new THREE.MeshStandardMaterial({ color: 0x4c4744, roughness: .95 }),
  path:  new THREE.MeshStandardMaterial({ color: 0x9a8a74, roughness: .9 }),
  crown: new THREE.MeshStandardMaterial({ color: 0xcbb494, roughness: .5 }),
  podium:new THREE.MeshStandardMaterial({ color: 0xb59a76, roughness: .6 }),
  glass: new THREE.MeshStandardMaterial({ color: 0xffc27a, roughness: .15, metalness: .4,
          emissive: 0xff9a45, emissiveIntensity: .35 }),
  roof:  new THREE.MeshStandardMaterial({ color: 0x3a3a40, roughness: .4, metalness: .6 }),
  mtn:   new THREE.MeshStandardMaterial({ color: 0x6e5d78, roughness: 1 }),
  trunk: new THREE.MeshStandardMaterial({ color: 0x6b4a2e, roughness: 1 }),
  leaf:  new THREE.MeshStandardMaterial({ color: 0x4f7034, roughness: 1 }),
  bush:  new THREE.MeshStandardMaterial({ color: 0x3c5c2a, roughness: 1 }),
  water: new THREE.MeshStandardMaterial({ color: 0x2e5a66, roughness: .05, metalness: .3 }),
  tire:  new THREE.MeshStandardMaterial({ color: 0x151515, roughness: .9 }),
  carGl: new THREE.MeshStandardMaterial({ color: 0x0e1420, roughness: .1, metalness: .5 }),
  skin:  new THREE.MeshStandardMaterial({ color: 0xc98f6b, roughness: .7 }),
  lampG: new THREE.MeshStandardMaterial({ color: 0xfff1cf, emissive: 0xffc878, emissiveIntensity: 1.4 }),
};

/* 파사드 캔버스 텍스처: 골든 석재 벽 + 딥글라스 창 그리드 */
function facadeTexture(cols, rows, wallHex, seed){
  const rnd = mulberry32(seed);
  const cw = 28, ch = 28;
  const cv = document.createElement('canvas');
  cv.width = cols * cw; cv.height = rows * ch;
  const g = cv.getContext('2d');
  g.fillStyle = wallHex; g.fillRect(0, 0, cv.width, cv.height);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const v = rnd();
      let col;
      if (v > 0.96)      col = `rgb(${200+rnd()*40|0}, ${140+rnd()*30|0}, ${70+rnd()*20|0})`; // 석양 반사 글린트
      else if (v > 0.90) col = 'rgb(96, 84, 66)';   // 흐린 반사
      else {
        const d = 22 + rnd()*18 | 0;
        col = `rgb(${d}, ${d+6}, ${d+14})`;          // 딥 글라스
      }
      g.fillStyle = col;
      g.fillRect(c*cw + cw*0.18, r*ch + ch*0.24, cw*0.64, ch*0.5);
    }
  }
  const tx = new THREE.CanvasTexture(cv);
  tx.colorSpace = THREE.SRGBColorSpace;
  tx.anisotropy = 8;
  return tx;
}
function facadeMats(cols, rows, wallHex, wallColor, seed){
  const tex = facadeTexture(cols, rows, wallHex, seed);
  const side = new THREE.MeshStandardMaterial({ map: tex, roughness: .55, metalness: .12 });
  const top  = new THREE.MeshStandardMaterial({ color: wallColor, roughness: .6 });
  return [side, side, top, top, side, side];
}

const group = new THREE.Group();
scene.add(group);
function box(w, h, d, mat, pos, ry = 0, shadow = true){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.copy(pos); m.rotation.y = ry;
  m.castShadow = shadow; m.receiveShadow = true;
  group.add(m); return m;
}

/* == 지면/도로/광장 =========================================== */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1700, 1700), M.grass);
ground.rotation.x = -Math.PI/2; ground.position.copy(BL(0, 0, 0));
ground.receiveShadow = true; group.add(ground);
box(900, .3, 14, M.road, BL(0, -70, .15), 0, false);
box(20, .28, 600, M.road, BL(-110, 40, .14), 0, false);
box(20, .28, 600, M.road, BL(110, 40, .14), 0, false);
box(380, .26, 120, M.path, BL(0, 8, .13), 0, false);
box(10, .3, 80, M.path, BL(0, -45, .15), 0, false);

/* == 메인 타워 5개동 =========================================== */
const TOWERS = [
  [-75, 10, 165, '#8d7a5e', 0xa08a68, 11],
  [-45, -5, 215, '#9b8a70', 0xb09a78, 22],
  [ -5,-15, 235, '#9b8a70', 0xb09a78, 33],
  [ 35, -5, 205, '#9b8a70', 0xb09a78, 44],
  [ 70, 10, 180, '#8d7a5e', 0xa08a68, 55],
];
for (const [x, y, h, wallHex, wallCol, seed] of TOWERS) {
  const floors = Math.round(h / 3.6);
  const t = new THREE.Mesh(new THREE.BoxGeometry(24, h, 18), facadeMats(7, floors, wallHex, wallCol, seed));
  t.position.copy(BL(x, y, h/2)); t.castShadow = t.receiveShadow = true;
  group.add(t);
  box(1.2, h*0.995, 10, M.crown, BL(x-12, y, h/2));
  box(1.2, h*0.995, 10, M.crown, BL(x+12, y, h/2));
  box(22, 5, 15.3, M.crown, BL(x, y, h+2.5));
  box(13.2, 4, 9.9, M.crown, BL(x, y, h+6.5));
}

/* == 포디움 상가 =============================================== */
for (const [px, py, pw, pd] of [[-60,35,55,30],[0,40,70,35],[60,35,55,30]]) {
  box(pw, 12, pd, M.podium, BL(px, py, 6));
  box(pw*0.85, 9, 2.5, M.glass, BL(px, py - pd/2 + 1, 5));
  const roof = box(pw*1.06, 2, pd*1.1, M.roof, BL(px, py, 13.5));
  roof.rotation.x = 0.07;
}

/* == 배경 아파트 클러스터 ====================================== */
{
  const rnd = mulberry32(42);
  const uni = (a,b)=>a+(b-a)*rnd();
  for (const [bx, by] of [[-160,60],[-135,90],[-170,120],[150,60],[135,95],[175,115],[200,80],[-110,150],[110,150],[0,180],[-50,170],[55,175]]) {
    const h = uni(60,100), w = uni(30,45);
    const fl = Math.round(h/3.4);
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, 14), facadeMats(9, fl, '#7d6f5c', 0x8f8070, (bx*7^by*13)>>>0));
    b.position.copy(BL(bx, by, h/2)); b.castShadow = b.receiveShadow = true;
    group.add(b);
    box(w*0.9, 3, 12, M.crown, BL(bx, by, h+1.5));
  }
}

/* == 원경: 산 + 도시 스카이라인 ================================ */
for (const [mx,my,mw,mh] of [[-350,460,500,90],[0,500,600,120],[330,470,450,80],[-120,480,400,70],[180,490,380,100]]) {
  const c = new THREE.Mesh(new THREE.ConeGeometry(mw, mh, 6, 1), M.mtn);
  c.position.copy(BL(mx, my, mh/2 - 5)); c.scale.set(1, 1, 0.45);
  group.add(c);
}

/* == 나무 (InstancedMesh) ====================================== */
const treeSpots = [];
{
  const rnd = mulberry32(7);
  const uni = (a,b)=>a+(b-a)*rnd();
  for (let i=0;i<45;i++) treeSpots.push([uni(-170,170), uni(-58,-25), uni(.8,1.4)]);
  for (let x=-160;x<170;x+=22) treeSpots.push([x, -62, uni(.8,1.4)]);
  for (let i=0;i<15;i++) treeSpots.push([uni(-90,90), uni(28,55), uni(.8,1.4)]);
  for (let a=0;a<360;a+=40) treeSpots.push([-120+30*Math.cos(a*Math.PI/180)*1.3, -40+30*Math.sin(a*Math.PI/180)*.75, uni(.9,1.3)]);
}
{
  const n = treeSpots.length;
  const trunkI = new THREE.InstancedMesh(new THREE.CylinderGeometry(.4,.5,4,7), M.trunk, n);
  const crownI = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(2.8,1), M.leaf, n);
  const d = new THREE.Object3D();
  const col = new THREE.Color();
  treeSpots.forEach(([x,y,s], i) => {
    d.position.copy(BL(x, y, 2*s)); d.scale.setScalar(s); d.updateMatrix();
    trunkI.setMatrixAt(i, d.matrix);
    d.position.copy(BL(x, y, 5.5*s)); d.updateMatrix();
    crownI.setMatrixAt(i, d.matrix);
    crownI.setColorAt(i, col.setHSL(.26, .42, .3 + (i%5)*.025));
  });
  trunkI.castShadow = crownI.castShadow = true;
  group.add(trunkI, crownI);
}

/* == 관목/화단/연못 ============================================ */
{
  const rnd = mulberry32(55);
  const uni = (a,b)=>a+(b-a)*rnd();
  const bushG = new THREE.IcosahedronGeometry(1, 1);
  const bushI = new THREE.InstancedMesh(bushG, M.bush, 50);
  const d = new THREE.Object3D();
  for (let i=0;i<50;i++){
    const z = rnd() < .5 ? [uni(-175,175), uni(-58,-22)] : [uni(-95,95), uni(4,20)];
    const s = uni(.8,1.8);
    d.position.copy(BL(z[0], z[1], .5*s)); d.scale.set(s, s*.55, s); d.updateMatrix();
    bushI.setMatrixAt(i, d.matrix);
  }
  bushI.castShadow = true; group.add(bushI);

  const fr = new THREE.MeshStandardMaterial({ color: 0xa62a26, roughness: .8 });
  const fy = new THREE.MeshStandardMaterial({ color: 0xcf9c1c, roughness: .8 });
  for (let fx=-60; fx<=60; fx+=12) {
    for (const [fy2, fm] of [[-22, fr], [-58, fy]]) {
      const f = new THREE.Mesh(bushG, fm);
      f.position.copy(BL(fx+uni(-1,1), fy2+uni(-1,1), .35));
      f.scale.set(1.6, .35, 1.2); group.add(f);
    }
  }
  const pond = new THREE.Mesh(new THREE.CylinderGeometry(22, 22, .15, 40), M.water);
  pond.position.copy(BL(-120, -40, .1)); pond.scale.set(1.3, 1, .75);
  group.add(pond);
}

/* == 가로등 ==================================================== */
for (let lx=-180; lx<190; lx+=45) {
  box(.7, 9, .7, M.trunk, BL(lx, -63, 4.5));
  const b = new THREE.Mesh(new THREE.SphereGeometry(.8, 10, 8), M.lampG);
  b.position.copy(BL(lx, -63, 9.3)); group.add(b);
}

/* == 인파 (움직이는 사람들) ==================================== */
const PEOPLE_N = 120;
const cloth = [0x8c2620, 0x1f3366, 0xd9ccb8, 0x26522e, 0x4d4d54, 0xa6733f];
const people = [];
{
  const rnd = mulberry32(21);
  const uni = (a,b)=>a+(b-a)*rnd();
  const bodyI = new THREE.InstancedMesh(new THREE.CylinderGeometry(.32,.36,1.35,8),
                new THREE.MeshStandardMaterial({ roughness: .85 }), PEOPLE_N);
  const headI = new THREE.InstancedMesh(new THREE.SphereGeometry(.2, 8, 6), M.skin, PEOPLE_N);
  const col = new THREE.Color();
  for (let i=0;i<PEOPLE_N;i++){
    let x, y;
    if (i < 70)      { x = uni(-170,170); y = uni(-56,-24); }
    else if (i < 95) { x = uni(-8,8);     y = uni(-48,-18); }
    else { x = [uni(-55,-30), uni(-15,20), uni(30,55)][i%3]; y = uni(6,18); }
    people.push({ x, y, s: uni(.9,1.1),
      vx: (rnd()-.5)*2.2, vy: (rnd()-.5)*1.2,
      x0: x, y0: y, ph: rnd()*Math.PI*2 });
    bodyI.setColorAt(i, col.setHex(cloth[i % cloth.length]));
  }
  bodyI.castShadow = headI.castShadow = true;
  group.add(bodyI, headI);
  var peopleBody = bodyI, peopleHead = headI;
}
const pDummy = new THREE.Object3D();
function updatePeople(t){
  for (let i=0;i<PEOPLE_N;i++){
    const p = people[i];
    const wx = p.x0 + Math.sin(t*.14 + p.ph) * p.vx * 6;
    const wy = p.y0 + Math.cos(t*.11 + p.ph) * p.vy * 6;
    const bob = Math.abs(Math.sin(t*2.2 + p.ph)) * .06;
    pDummy.position.copy(BL(wx, wy, .675*p.s + bob));
    pDummy.scale.setScalar(p.s); pDummy.updateMatrix();
    peopleBody.setMatrixAt(i, pDummy.matrix);
    pDummy.position.copy(BL(wx, wy, 1.52*p.s + bob)); pDummy.updateMatrix();
    peopleHead.setMatrixAt(i, pDummy.matrix);
  }
  peopleBody.instanceMatrix.needsUpdate = true;
  peopleHead.instanceMatrix.needsUpdate = true;
}

/* == 차량 (주행 애니메이션) ==================================== */
const carCols = [0xb3b3b8, 0x1a1a20, 0x8c1414, 0x1f3366, 0xcfc9bd, 0x40404a];
const cars = [];
function makeCar(colHex, vertical){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(4.4, 1.0, 1.9),
    new THREE.MeshStandardMaterial({ color: colHex, roughness: .3, metalness: .55 }));
  body.position.y = .75; body.castShadow = true; g.add(body);
  const cab = new THREE.Mesh(new THREE.BoxGeometry(2.3, .72, 1.7), M.carGl);
  cab.position.set(-.2, 1.5, 0); g.add(cab);
  const wg = new THREE.CylinderGeometry(.42,.42,.3,10);
  for (const [dx,dz] of [[-1.5,-.95],[-1.5,.95],[1.5,-.95],[1.5,.95]]) {
    const w = new THREE.Mesh(wg, M.tire);
    w.rotation.x = Math.PI/2; w.position.set(dx, .42, dz); g.add(w);
  }
  if (vertical) g.rotation.y = Math.PI/2;
  group.add(g); return g;
}
{
  const rnd = mulberry32(33);
  for (let i=0;i<14;i++){
    const lane = i%2===0 ? -67 : -73;
    const dir  = i%2===0 ? 1 : -1;
    const car = makeCar(carCols[i%6], false);
    cars.push({ g: car, mode:'h', lane, dir, x: -220 + i*32, speed: 9+ (i%4)*2.5 });
  }
  for (let j=0;j<5;j++){
    const rx = j<3 ? -110 + (j%2? 3 : -3) : 110 + (j%2? 3 : -3);
    const dir = j%2 ? 1 : -1;
    const car = makeCar(carCols[(j+2)%6], true);
    cars.push({ g: car, mode:'v', rx, dir, y: -40 + j*55, speed: 8 + j*2 });
  }
}
function updateCars(dt){
  for (const c of cars){
    if (c.mode==='h'){
      c.x += c.dir * c.speed * dt;
      if (c.x > 240) c.x = -240; if (c.x < -240) c.x = 240;
      c.g.position.copy(BL(c.x, c.lane, 0));
      c.g.rotation.y = c.dir > 0 ? 0 : Math.PI;
    } else {
      c.y += c.dir * c.speed * dt;
      if (c.y > 200) c.y = -60; if (c.y < -60) c.y = 200;
      c.g.position.copy(BL(c.rx, c.y, 0));
      c.g.rotation.y = c.dir > 0 ? -Math.PI/2 : Math.PI/2;
    }
  }
}

function buildUnit(key){
  const u = UNITS[key];
  const { cx, front, z0, W, D, H } = u;
  const x0 = cx - W/2;
  // 로컬(lx,ly,lz중심) → 월드: three (x0+lx, z0+lz, -(front+ly)), 크기 (sx, sz, sy)
  const put = (lx, ly, lz, sx, sy, sz, matKey) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sz, sy), IMAT[matKey]);
    m.position.set(x0 + lx, z0 + lz, -(front + ly));
    m.receiveShadow = true;
    group.add(m); return m;
  };
  // 셸
  put(W/2, D/2, .075, W, D, .15, u.floor);            // 바닥
  put(W/2, D/2, H+.06, W, D, .12, 'wallw');           // 천장
  put(W/2, D-.075, H/2, W, .15, H, 'wallw');          // 뒷벽
  put(.075, D/2, H/2, .15, D, H, 'wallw');            // 좌벽
  put(W-.075, D/2, H/2, .15, D, H, 'wallw');          // 우벽
  put(W/2, -1.1, .075, W, 2.2, .15, 'marble');        // 발코니
  put(W/2, -2.16, .55, W, .08, 1.1, 'iglass');        // 난간
  put(W/2, .03, H/2, W, .06, H, 'iglass');            // 전면 유리
  put(W/3, .03, H/2, .12, .12, H, 'counter');
  put(W*2/3, .03, H/2, .12, .12, H, 'counter');
  // 가구
  for (const f of FURN[key]) put(...f);
  // 실내 조명
  for (const ly of [D*.28, D*.72]) {
    const li = new THREE.PointLight(0xffe0b0, 8, D*3.0, 2);
    li.position.set(cx, z0 + H - .55, -(front + ly));
    group.add(li);
  }
  if (key === 'u80') {
    const ch = new THREE.PointLight(0xffd98f, 20, 30, 2);
    ch.position.set(x0 + 9.2, z0 + 2.3, -(front + 2.6));
    group.add(ch);
  }
}

/* 인테리어 투어 카메라: 외부 어프로치 → 발코니 관통 진입 → 실내 룩어라운드 */
function tourFn(key){
  const u = UNITS[key];
  const { cx, front, z0, W, D, H } = u;
  const zFace = -front;                    // 파사드 평면 (three z)
  const eye = z0 + 1.6;
  const P0 = new THREE.Vector3(cx + 38, z0 + 20, zFace + 95);   // 원경 어프로치 시점
  const P1 = new THREE.Vector3(cx, eye + .1, zFace + 7.5);      // 발코니 앞
  const P2 = new THREE.Vector3(cx, eye, zFace - D * .45);       // 실내 안착점 (중앙부)
  const ease = s => (1 - Math.cos(Math.min(Math.max(s,0),1) * Math.PI)) / 2;
  const A = 6, B = 2.5;
  return (t) => {
    const pos = new THREE.Vector3(), tgt = new THREE.Vector3();
    let fov = 42;
    if (t < A) {                                        // 어프로치
      pos.lerpVectors(P0, P1, ease(t / A));
      tgt.set(cx, eye, zFace - 2);
    } else if (t < A + B) {                             // 유리 관통 진입
      const s = ease((t - A) / B);
      pos.lerpVectors(P1, P2, s);
      tgt.set(cx, eye - .15, zFace - D * .75);
      fov = 42 + s * 20;
    } else {                                            // 실내 360° 룩어라운드
      const tr = t - A - B;
      const yaw = tr * .3;                               // 약 21초에 한 바퀴
      const pitch = Math.sin(tr * .21) * .4 - .12;
      pos.copy(P2);
      pos.x += Math.sin(tr * .18) * Math.min(W * .06, 1.0);
      pos.y += Math.sin(tr * .27) * .1;
      tgt.set(
        pos.x + Math.sin(yaw) * 7,
        pos.y + pitch,
        pos.z - Math.cos(yaw) * 7
      );
      fov = 62;
    }
    return [pos, tgt, fov];
  };
}

let modeIdx = 0, prevIdx = 0, blend = 1;
let tMode = 0, tPrev = 0;
const clock = new THREE.Clock();

const capEl = document.getElementById('caption');
const btns = [...document.querySelectorAll('.panel button')];
function setMode(i){
  if (i === modeIdx) return;
  prevIdx = modeIdx; tPrev = tMode;
  modeIdx = i; tMode = 0; blend = 0;
  btns.forEach((b,j)=>b.classList.toggle('on', j===i));
  showCaption(MODES[i].desc);
}
let capTimer;
function showCaption(html){
  capEl.innerHTML = html;
  capEl.classList.add('show');
  clearTimeout(capTimer);
  capTimer = setTimeout(()=>capEl.classList.remove('show'), 4200);
}
btns.forEach(b => b.addEventListener('click', () => setMode(+b.dataset.mode)));
btns[0].classList.add('on');
showCaption(MODES[0].desc);

addEventListener('keydown', e => {
  const n = parseInt(e.key);
  if (n >= 1 && n <= 9) setMode(n-1);
});

const _p1 = new THREE.Vector3(), _t1 = new THREE.Vector3();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;
  tMode += dt; tPrev += dt;
  if (blend < 1) blend = Math.min(1, blend + dt / 1.6);
  const e = blend<1 ? (1 - Math.cos(blend*Math.PI))/2 : 1;   // easeInOut

  const [pA, tA, fA = 38] = MODES[prevIdx].fn(tPrev);
  const [pB, tB, fB = 38] = MODES[modeIdx].fn(tMode);
  _p1.lerpVectors(pA, pB, e); _t1.lerpVectors(tA, tB, e);
  camera.position.copy(_p1);
  camera.lookAt(_t1);
  const fv = fA + (fB - fA) * e;
  if (Math.abs(camera.fov - fv) > .01) { camera.fov = fv; camera.updateProjectionMatrix(); }

  updatePeople(t);
  updateCars(dt);
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
