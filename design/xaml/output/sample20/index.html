</style>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const PERFORMER_URL = '../sample19/models/claire.glb';   // 재사용: 텍스처+16모션
const CLR = { warm:0xfff2e0, blue:0x5a72ff, pillar:0x3a5bff, spark:0xffd27a };

// ---------- renderer / scene / camera ----------
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.82;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02030a);
scene.fog = new THREE.FogExp2(0x03040e, 0.028);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.08, 400);
camera.position.set(0, 2.4, 9);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.35, 0);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 1.5; controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI*0.52;
controls.enabled = false;   // start in auto-cam

// ---------- lighting rig ----------
const rig = new THREE.Group(); scene.add(rig);
const amb = new THREE.AmbientLight(0x223055, 0.0); scene.add(amb);          // raised at intro
const hemi = new THREE.HemisphereLight(0x24304f, 0x05060c, 0.0); scene.add(hemi);

// warm key spotlight on performer (SpotMic 재현)
const spotMic = new THREE.SpotLight(CLR.warm, 0, 22, THREE.MathUtils.degToRad(19), 0.45, 1.2);
spotMic.position.set(0.3, 6.6, 1.2);
spotMic.target.position.set(0, 1.2, 0.1);
scene.add(spotMic, spotMic.target);
spotMic.castShadow = true; spotMic.shadow.mapSize.set(1024,1024);
spotMic.shadow.camera.near = 1; spotMic.shadow.camera.far = 12; spotMic.shadow.bias = -0.0004;

// piano spot + blue back rim
const spotPiano = new THREE.SpotLight(0xfff0dd, 0, 20, THREE.MathUtils.degToRad(24), 0.5, 1.3);
spotPiano.position.set(-2.2, 5.4, -0.6); spotPiano.target.position.set(-1.7, 0.6, -1.3);
scene.add(spotPiano, spotPiano.target);
const backRim = new THREE.DirectionalLight(0x5566bb, 0.0);
backRim.position.set(-2.5, 4, -6); scene.add(backRim);

// ---------- reflective stage floor ----------
const floorGeo = new THREE.PlaneGeometry(120, 120);
const mirror = new Reflector(floorGeo, {
  textureWidth: 1024, textureHeight: 1024, color: 0x0a0c16
});
mirror.rotation.x = -Math.PI/2; mirror.position.y = 0.001; scene.add(mirror);
// dark gloss overlay to tame the mirror + add tint
const floorTop = new THREE.Mesh(floorGeo, new THREE.MeshStandardMaterial({
  color:0x05060d, roughness:0.34, metalness:0.75, transparent:true, opacity:0.62 }));
floorTop.rotation.x = -Math.PI/2; floorTop.position.y = 0.002; scene.add(floorTop);

// ---------- grand piano (stylized) ----------
function buildPiano(){
  const g = new THREE.Group();
  const black = new THREE.MeshStandardMaterial({color:0x08080b, roughness:0.18, metalness:0.6});
  const gloss = new THREE.MeshStandardMaterial({color:0x0e0e12, roughness:0.22, metalness:0.45});
  // body (rounded wing shape via scaled cylinder + box)
  const body = new THREE.Mesh(new THREE.CylinderGeometry(1.15,1.15,0.34,48,1,false,0,Math.PI), black);
  body.scale.set(1.0,1,1.55); body.position.set(0,0.62,-0.2); body.rotation.y=Math.PI*0.5; g.add(body);
  const box = new THREE.Mesh(new THREE.BoxGeometry(1.5,0.34,1.1), black);
  box.position.set(0.55,0.62,-0.2); g.add(box);
  // keybed
  const kb = new THREE.Mesh(new THREE.BoxGeometry(1.42,0.12,0.34), gloss);
  kb.position.set(0.6,0.62,0.62); g.add(kb);
  // keys strip (reactive)
  const keys=[]; const kW=1.34, n=26, kw=kW/n;
  for(let i=0;i<n;i++){
    const wk=new THREE.Mesh(new THREE.BoxGeometry(kw*0.86,0.04,0.3),
      new THREE.MeshStandardMaterial({color:0xa6a69c,roughness:0.7,emissive:0x000000}));
    wk.position.set(0.6 - kW/2 + i*kw + kw/2, 0.7, 0.66); g.add(wk); keys.push(wk);
  }
  // open lid (angled plane)
  const lid = new THREE.Mesh(new THREE.PlaneGeometry(2.3,1.9), gloss);
  lid.position.set(0.1,1.15,-0.35); lid.rotation.set(-Math.PI*0.62,0,0); lid.material.side=THREE.DoubleSide; g.add(lid);
  // legs
  const legGeo=new THREE.CylinderGeometry(0.05,0.05,0.62,10);
  [[0.55,-0.9],[1.15,0.5],[-0.5,0.5]].forEach(p=>{
    const l=new THREE.Mesh(legGeo,black); l.position.set(p[0],0.31,p[1]); g.add(l);
  });
  g.userData.keys = keys;
  return g;
}
const piano = buildPiano();
piano.position.set(-1.55, 0, -1.25); piano.rotation.y = 0.5; scene.add(piano);

// bench
const bench = new THREE.Group();
const bmat = new THREE.MeshStandardMaterial({color:0x0b0b10, roughness:0.3, metalness:0.5});
const seat=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.08,0.35),bmat); seat.position.y=0.5; bench.add(seat);
[[-0.38,-0.13],[0.38,-0.13],[-0.38,0.13],[0.38,0.13]].forEach(p=>{
  const l=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.5,0.05),bmat); l.position.set(p[0],0.25,p[1]); bench.add(l);});
bench.position.set(-1.0,0,-0.1); bench.rotation.y=0.5; scene.add(bench);

// ---------- LED pillars (emissive + bloom) ----------
const pillars=[];
function ledPillar(x,z,h){
  const m=new THREE.MeshBasicMaterial({color:CLR.pillar});
  const p=new THREE.Mesh(new THREE.BoxGeometry(0.14,h,0.14), m);
  p.position.set(x,h/2,z); scene.add(p);
  const halo=new THREE.PointLight(CLR.pillar, 6, 9, 2); halo.position.set(x,h*0.6,z); scene.add(halo);
  pillars.push({mesh:p, light:halo, base:6}); return p;
}
ledPillar(-2.7,0.6,5.6); ledPillar(2.7,0.6,5.6);
ledPillar(-3.5,-4.5,5.0); ledPillar(3.5,-4.5,5.0);

// ---------- constellation backdrop ----------
function constellation(){
  const N=900, pos=new Float32Array(N*3), col=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    pos[i*3]=(Math.random()-0.5)*44; pos[i*3+1]=Math.random()*20+1.5; pos[i*3+2]=-16-Math.random()*6;
    const t=Math.random(); const c=new THREE.Color().setHSL(0.58+0.08*t,0.6,0.6+0.35*Math.random());
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  const mat=new THREE.PointsMaterial({size:0.14,map:dot(),vertexColors:true,transparent:true,
    blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true});
  return new THREE.Points(geo,mat);
}
function dot(){
  const c=document.createElement('canvas'); c.width=c.height=64; const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.3,'rgba(255,255,255,.8)');
  g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle=g; x.fillRect(0,0,64,64);
  const t=new THREE.CanvasTexture(c); return t;
}
const stars=constellation(); scene.add(stars);

// ---------- fan lightstick sea (LightSea 재현: 응원봉 바다) ----------
const SEA_N = 5000;
let sea, seaPhase;
function buildSea(){
  const pos=new Float32Array(SEA_N*3), col=new Float32Array(SEA_N*3), ph=new Float32Array(SEA_N), base=new Float32Array(SEA_N*3);
  const palette=[0xff5aa0,0x5aa0ff,0xffd27a,0xa06aff,0x6affc0,0xff8a5a];
  for(let i=0;i<SEA_N;i++){
    const x=(Math.random()-0.5)*60;
    const z=3 + Math.random()*46;             // 무대 앞(카메라쪽)으로 펼쳐진 관중
    const y=0.2 + Math.random()*Math.min(6, 1+z*0.12);
    pos[i*3]=x; pos[i*3+1]=y; pos[i*3+2]=z; base[i*3]=x;base[i*3+1]=y;base[i*3+2]=z;
    const c=new THREE.Color(palette[i%palette.length]);
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b; ph[i]=Math.random()*Math.PI*2;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  geo.userData.base=base; seaPhase=ph;
  const mat=new THREE.PointsMaterial({size:0.24,map:dot(),vertexColors:true,transparent:true,
    blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true,opacity:0.0});
  sea=new THREE.Points(geo,mat); scene.add(sea);
}
buildSea();

// crowd silhouette (dark heads near stage front)
function crowd(){
  const g=new THREE.Group(); const m=new THREE.MeshBasicMaterial({color:0x01010a});
  const geo=new THREE.SphereGeometry(0.16,8,6);
  for(let i=0;i<160;i++){
    const h=new THREE.Mesh(geo,m);
    h.position.set((Math.random()-0.5)*22, 0.15+Math.random()*0.3, 3+Math.random()*7);
    h.scale.y=1.4; g.add(h);
  }
  return g;
}
scene.add(crowd());

// ---------- falling sparks ----------
const SPARK_N=420; let sparks, sparkVel;
(function(){
  const pos=new Float32Array(SPARK_N*3); sparkVel=new Float32Array(SPARK_N);
  for(let i=0;i<SPARK_N;i++){
    pos[i*3]=(Math.random()-0.5)*10; pos[i*3+1]=Math.random()*9; pos[i*3+2]=-3+Math.random()*6;
    sparkVel[i]=0.5+Math.random()*1.4;
  }
  const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const mat=new THREE.PointsMaterial({color:CLR.spark,size:0.07,map:dot(),transparent:true,
    blending:THREE.AdditiveBlending,depthWrite:false,opacity:0.0});
  sparks=new THREE.Points(geo,mat); scene.add(sparks);
})();

// ---------- volumetric spot cone on performer ----------
function volCone(){
  const geo=new THREE.ConeGeometry(1.15,6.2,32,1,true);
  const mat=new THREE.MeshBasicMaterial({color:0xffe8c8,transparent:true,opacity:0.0,
    blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
  const c=new THREE.Mesh(geo,mat); c.position.set(0.15,3.3,0.4); return c;
}
const cone=volCone(); scene.add(cone);

// ---------- performer (claire.glb 재사용) ----------
let mixer, clips={}, current=null, performer=null;
const loader=new GLTFLoader();
loader.load(PERFORMER_URL, (g)=>{
  performer=g.scene;
  performer.traverse(o=>{ if(o.isMesh){o.castShadow=true; o.frustumCulled=false;} });
  // normalize ~1.6 tall, place front-center facing +Z(카메라/관중)
  performer.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(performer); const s=1.62/(box.max.y-box.min.y);
  performer.scale.setScalar(s);
  performer.updateMatrixWorld(true);
  const b2=new THREE.Box3().setFromObject(performer);
  performer.position.set(0, -b2.min.y, 0.1);
  performer.rotation.y=0;   // 관중/카메라(+Z) 바라보게
  scene.add(performer);
  mixer=new THREE.AnimationMixer(performer);
  (g.animations||[]).forEach(a=>clips[a.name]=a);
  buildMotionUI(Object.keys(clips));
  const first = clips['Hip-Hop-Dancing']?'Hip-Hop-Dancing':Object.keys(clips)[0];
  if(first) play(first);
  document.getElementById('loading').style.opacity=0;
  setTimeout(()=>document.getElementById('loading').style.display='none',800);
  startIntro();
}, undefined, (e)=>{ document.getElementById('loading').textContent='로드 실패: '+PERFORMER_URL; });

function play(name){
  if(!clips[name]) return;
  const next=mixer.clipAction(clips[name]); next.reset().setEffectiveWeight(1).fadeIn(0.4).play();
  if(current&&current!==next) current.fadeOut(0.4);
  current=next;
  [...document.querySelectorAll('#mlist button')].forEach(b=>b.classList.toggle('on', b.dataset.n===name));
}
function buildMotionUI(names){
  const el=document.getElementById('mlist'); el.innerHTML='';
  names.forEach(n=>{ const b=document.createElement('button'); b.textContent=n.replace(/-/g,' ');
    b.dataset.n=n; b.onclick=()=>play(n); el.appendChild(b); });
}

// ---------- intro: blackout -> lights rise ----------
let introT=0, introing=false;
const TARGET={amb:0.34, hemi:0.6, mic:88, piano:34, rim:0.6, cone:0.05, sea:0.95, spark:0.8, pillar:5};
function startIntro(){ introT=0; introing=true; setLevels(0); }
function setLevels(k){   // k:0..1
  amb.intensity=TARGET.amb*k; hemi.intensity=TARGET.hemi*k;
  spotMic.intensity=TARGET.mic*k; spotPiano.intensity=TARGET.piano*k;
  backRim.intensity=TARGET.rim*k; cone.material.opacity=TARGET.cone*k;
  sea.material.opacity=TARGET.sea*Math.min(1,k*1.1); sparks.material.opacity=TARGET.spark*k;
  pillars.forEach(p=>{ p.light.intensity=p.base*(0.25+0.75*k); p.mesh.material.color.setHex(CLR.pillar); });
}

// ---------- camera director ----------
const SHOTS=[
  {n:'Wide · 응원봉 바다', p:[0,2.3,9.2], t:[0,1.4,0], d:11},
  {n:'Push In', p:[0.2,1.55,4.6], t:[0,1.45,0], d:9, p2:[0.1,1.5,3.1]},
  {n:'Side Dolly', p:[5.2,1.5,2.2], t:[0,1.3,-0.3], d:10, p2:[5.0,1.4,-1.6]},
  {n:'Piano Feature', p:[-2.6,1.15,1.4], t:[-1.6,0.7,-1.25], d:9},
  {n:'Crane Up', p:[0,4.6,7.2], t:[0,1.1,0], d:10, p2:[0,7.4,9.4]},
  {n:'Close Orbit', p:[2.4,1.6,2.4], t:[0,1.35,0.1], d:12, orbit:true},
];
let shotI=0, shotT=0, autoCam=true;
const _p=new THREE.Vector3(), _t=new THREE.Vector3();
function ease(x){ return x<0.5?2*x*x:1-Math.pow(-2*x+2,2)/2; }
function updateCam(dt){
  if(!autoCam){ controls.update(); return; }
  const s=SHOTS[shotI]; shotT+=dt; let k=Math.min(1, shotT/s.d);
  if(s.orbit){
    const a=shotT*0.32, r=3.0;
    _p.set(Math.cos(a)*r, 1.55+Math.sin(shotT*0.5)*0.15, Math.sin(a)*r+0.1);
  } else {
    const e=ease(k); const p1=s.p, p2=s.p2||s.p;
    _p.set(p1[0]+(p2[0]-p1[0])*e, p1[1]+(p2[1]-p1[1])*e, p1[2]+(p2[2]-p1[2])*e);
  }
  _t.set(s.t[0],s.t[1],s.t[2]);
  camera.position.lerp(_p, 1-Math.pow(0.001,dt));
  controls.target.lerp(_t, 1-Math.pow(0.001,dt));
  camera.lookAt(controls.target);
  if(shotT>=s.d) nextShot();
}
function nextShot(){ shotI=(shotI+1)%SHOTS.length; shotT=0; document.getElementById('shotName').textContent=SHOTS[shotI].n; }

// ---------- post fx ----------
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.55, 0.6, 0.6);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- UI wiring ----------
let playing=true;
const bPlay=document.getElementById('btnPlay'), bCam=document.getElementById('btnCam');
bPlay.onclick=()=>{ playing=!playing; bPlay.classList.toggle('on',playing); bPlay.textContent=playing?'⏸ 공연중':'▶ 재생'; };
bCam.onclick=()=>{ autoCam=!autoCam; controls.enabled=!autoCam; bCam.classList.toggle('on',autoCam);
  bCam.textContent=autoCam?'🎥 오토캠':'🖐 수동캠'; if(autoCam){shotT=0;} };
document.getElementById('btnShot').onclick=()=>{ if(autoCam) nextShot(); };
document.getElementById('btnIntro').onclick=()=>startIntro();

// ---------- loop ----------
const clock=new THREE.Clock(); let elapsed=0;
function fmt(s){ const m=(s/60)|0, ss=(s%60)|0; return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05); elapsed+=dt;
  if(introing){ introT+=dt; const k=Math.min(1,introT/3.2); setLevels(ease(k)); if(k>=1) introing=false; }
  if(mixer&&playing) mixer.update(dt);
  // sea twinkle + sway
  if(sea){
    const p=sea.geometry.attributes.position.array, b=sea.geometry.userData.base;
    for(let i=0;i<SEA_N;i++){ const j=i*3;
      p[j]=b[j]+Math.sin(elapsed*1.1+seaPhase[i])*0.12;
      p[j+1]=b[j+1]+Math.sin(elapsed*2.0+seaPhase[i])*0.06;
    }
    sea.geometry.attributes.position.needsUpdate=true;
    sea.material.size=0.24+Math.sin(elapsed*3)*0.025;
  }
  // sparks fall
  if(sparks){ const p=sparks.geometry.attributes.position.array;
    for(let i=0;i<SPARK_N;i++){ p[i*3+1]-=sparkVel[i]*dt; if(p[i*3+1]<0.05){p[i*3+1]=8.5+Math.random()*1.5;} }
    sparks.geometry.attributes.position.needsUpdate=true; }
  // pillar pulse
  pillars.forEach((p,i)=>{ const f=0.75+0.25*Math.sin(elapsed*2.4+i); p.light.intensity=p.base*(introing?0.3:f); });
  // reactive piano keys
  if(piano.userData.keys){ piano.userData.keys.forEach((k,i)=>{
    const on=(Math.sin(elapsed*4+i*0.7)>0.85)&&playing;
    k.material.emissive.setHex(on?0x4466aa:0x000000); k.position.y=0.70-(on?0.012:0);
  });}
  cone.material.opacity=(introing?cone.material.opacity:0.09+Math.sin(elapsed*1.7)*0.025);
  updateCam(dt);
  document.getElementById('clock').textContent=fmt(elapsed);
  composer.render();
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
});
</script>
