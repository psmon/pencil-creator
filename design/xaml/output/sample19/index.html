<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sample 19 — 캐릭터 모션 데모</title>
<style>
  :root{ --bg1:#12141c; --acc:#5ad1ff; --acc2:#ff5a8a; --panel:rgba(20,24,36,.82); }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; font-family:'Segoe UI','Malgun Gothic',system-ui,sans-serif; color:#eaeef7; }
  #app{ position:fixed; inset:0; background:radial-gradient(1200px 800px at 50% 18%, #232a3d 0%, var(--bg1) 70%); }
  canvas{ display:block; }
  #panel{ position:fixed; top:0; left:0; height:100%; width:236px; background:var(--panel);
    backdrop-filter:blur(10px); border-right:1px solid rgba(255,255,255,.08); padding:14px 12px;
    display:flex; flex-direction:column; gap:7px; overflow-y:auto; z-index:10; }
  #panel h1{ font-size:16px; letter-spacing:.4px; }
  #panel .sub{ font-size:11px; color:#9aa6bf; margin:2px 0 6px; }
  .lbl{ font-size:11px; color:#7f8aa3; text-transform:uppercase; letter-spacing:.6px; margin:8px 2px 3px; }
  /* 캐릭터 선택 */
  #chars{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .cbtn{ padding:8px 6px; border-radius:9px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03);
    color:#dfe6f5; font-size:12px; cursor:pointer; transition:.15s; }
  .cbtn:hover{ background:rgba(90,209,255,.12); }
  .cbtn.active{ background:linear-gradient(90deg, rgba(90,209,255,.28), rgba(255,90,138,.14)); border-color:var(--acc); color:#fff; font-weight:600; }
  /* 모션 */
  #mlist{ display:flex; flex-direction:column; gap:6px; }
  .mbtn{ text-align:left; padding:8px 11px; border-radius:8px; border:1px solid rgba(255,255,255,.09);
    background:rgba(255,255,255,.03); color:#dfe6f5; font-size:12.5px; cursor:pointer; transition:.15s; }
  .mbtn:hover{ background:rgba(90,209,255,.12); border-color:rgba(90,209,255,.4); }
  .mbtn.active{ background:linear-gradient(90deg, rgba(90,209,255,.25), rgba(255,90,138,.12)); border-color:var(--acc); color:#fff; font-weight:600; }
  .empty{ font-size:12px; color:#7f8aa3; padding:8px 4px; }
  #cam{ position:fixed; right:16px; bottom:16px; display:flex; gap:8px; z-index:10; }
  #cam button{ width:44px; height:44px; border-radius:11px; border:1px solid rgba(255,255,255,.12);
    background:var(--panel); color:#eaeef7; font-size:18px; cursor:pointer; backdrop-filter:blur(8px); transition:.15s; }
  #cam button:hover{ background:rgba(90,209,255,.18); border-color:var(--acc); }
  #cam button.on{ background:rgba(255,90,138,.25); border-color:var(--acc2); }
  #hud{ position:fixed; top:14px; left:252px; z-index:10; font-size:13px; color:#c7d0e4;
    background:var(--panel); padding:7px 14px; border-radius:9px; backdrop-filter:blur(8px); }
  #hud b{ color:var(--acc); }
  #hint{ position:fixed; bottom:16px; left:252px; z-index:10; font-size:11px; color:#8894ad; }
  #loading{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:20;
    background:rgba(10,12,18,.7); flex-direction:column; gap:12px; font-size:14px; color:#cfe; pointer-events:none; opacity:0; transition:.2s; }
  #loading.show{ opacity:1; }
  .spin{ width:36px; height:36px; border:3px solid rgba(255,255,255,.15); border-top-color:var(--acc); border-radius:50%; animation:sp 1s linear infinite; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  @media(max-width:640px){ #panel{ width:172px; } #hud,#hint{ left:184px; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="panel">
  <h1>모션 <span style="color:var(--acc2)">데모</span></h1>
  <div class="sub">캐릭터 선택 · 모션 재생 · 드래그 회전 · 휠 줌</div>
  <div class="lbl">캐릭터</div>
  <div id="chars"></div>
  <div class="lbl">모션</div>
  <div id="mlist"></div>
</div>
<div id="hud"><b id="curChar">—</b> · <span id="curMotion">—</span></div>
<div id="hint">🖱️ 좌드래그 회전 · 휠 줌 · 우드래그 이동</div>
<div id="cam">
  <button id="zin" title="확대">＋</button>
  <button id="zout" title="축소">－</button>
  <button id="rot" title="자동 회전">⟲</button>
  <button id="reset" title="시점 초기화">⌂</button>
</div>
<div id="loading" class="show"><div class="spin"></div><div id="ltxt">로딩 중…</div></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const CHARS=[
  {id:'idolstar', name:'IdolStar', file:'idolstar.glb'},
  {id:'claire',   name:'Claire',   file:'claire.glb'},
  {id:'remy',     name:'Remy',     file:'remy.glb'},
  {id:'female8h', name:'Female8H', file:'female8h.glb'},
  {id:'taro',     name:'Taro',     file:'taro.glb'},
];

const app=document.getElementById('app');
const scene=new THREE.Scene(); scene.fog=new THREE.Fog(0x12141c, 6, 24);
const camera=new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,1.5,4.4);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xbfd4ff,0x20242e,1.1));
const key=new THREE.DirectionalLight(0xffffff,2.0); key.position.set(3,6,4); key.castShadow=true;
key.shadow.mapSize.set(1024,1024); Object.assign(key.shadow.camera,{top:3,bottom:-2,left:-3,right:3}); scene.add(key);
const fill=new THREE.DirectionalLight(0x88aaff,0.6); fill.position.set(-4,3,-2); scene.add(fill);
const ground=new THREE.Mesh(new THREE.CircleGeometry(8,64), new THREE.MeshStandardMaterial({color:0x1a1e2a,roughness:.95}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
const grid=new THREE.GridHelper(16,32,0x334455,0x232838); grid.material.opacity=.35; grid.material.transparent=true; scene.add(grid);

const controls=new OrbitControls(camera, renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=.08; controls.target.set(0,1.0,0);
controls.minDistance=1.0; controls.maxDistance=14; controls.maxPolarAngle=Math.PI*0.92;
const HOME={ pos:new THREE.Vector3(0,1.5,4.4), tgt:new THREE.Vector3(0,1.0,0) };

const loader=new GLTFLoader();
const loadingEl=document.getElementById('loading'), ltxt=document.getElementById('ltxt');
let root=null, mixer=null, current=null, clips={}, curChar=null;

// 캐릭터 버튼
const charsEl=document.getElementById('chars');
CHARS.forEach(c=>{ const b=document.createElement('button'); b.className='cbtn'; b.textContent=c.name; b.dataset.id=c.id;
  b.onclick=()=>loadChar(c); charsEl.appendChild(b); });

function clearChar(){
  if(root){ scene.remove(root); root.traverse(o=>{ if(o.isMesh){ o.geometry.dispose(); }}); }
  root=null; mixer=null; current=null; clips={};
}
function loadChar(c){
  document.querySelectorAll('.cbtn').forEach(b=>b.classList.toggle('active', b.dataset.id===c.id));
  document.getElementById('curChar').textContent=c.name;
  loadingEl.classList.add('show'); ltxt.textContent=c.name+' 로딩…';
  loader.load('models/'+c.file, (g)=>{
    clearChar(); curChar=c; root=g.scene;
    root.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.frustumCulled=false;
      const mats=Array.isArray(o.material)?o.material:[o.material]; mats.forEach(m=>{ if(m) m.side=THREE.DoubleSide; }); }});
    scene.add(root);
    // 스케일 정규화 1.7 + 바닥 (월드행렬 갱신 후 정확한 bbox)
    root.updateMatrixWorld(true);
    const box=new THREE.Box3().setFromObject(root); const size=new THREE.Vector3(); box.getSize(size);
    const s=1.7/Math.max(size.y,1e-4); root.scale.setScalar(s);
    root.updateMatrixWorld(true);
    const b2=new THREE.Box3().setFromObject(root); root.position.y-=b2.min.y; root.position.x-=(b2.min.x+b2.max.x)/2; root.position.z-=(b2.min.z+b2.max.z)/2;
    // 애니메이션
    clips={}; (g.animations||[]).forEach(a=>clips[a.name]=a);
    const names=Object.keys(clips);
    if(names.length){ mixer=new THREE.AnimationMixer(root); }
    buildMotions(names);
    if(names.length) play(names[0]); else document.getElementById('curMotion').textContent='정적 모델';
    loadingEl.classList.remove('show');
  }, (e)=>{ ltxt.textContent=c.name+' '+(e.total?Math.round(e.loaded/e.total*100):'')+'%'; },
     (err)=>{ ltxt.textContent='로드 실패 — 로컬 서버 필요'; console.error(err); });
}
function buildMotions(names){
  const list=document.getElementById('mlist'); list.innerHTML='';
  if(!names.length){ list.innerHTML='<div class="empty">이 캐릭터는 모션이 없습니다 (정적 모델).<br>회전·줌으로 감상하세요.</div>'; return; }
  names.forEach(n=>{ const b=document.createElement('button'); b.className='mbtn'; b.textContent=n.replace(/-/g,' ');
    b.dataset.name=n; b.onclick=()=>play(n); list.appendChild(b); });
}
function play(name){
  document.querySelectorAll('.mbtn').forEach(b=>b.classList.toggle('active', b.dataset.name===name));
  document.getElementById('curMotion').textContent=name.replace(/-/g,' ');
  if(!mixer||!clips[name]) return;
  const next=mixer.clipAction(clips[name]); next.reset().setEffectiveWeight(1).fadeIn(.35).play();
  if(current&&current!==next) current.fadeOut(.35);
  current=next;
}
// 카메라
function dolly(f){ const d=camera.position.clone().sub(controls.target).multiplyScalar(f); const l=d.length();
  if(l>controls.minDistance&&l<controls.maxDistance) camera.position.copy(controls.target).add(d); }
document.getElementById('zin').onclick=()=>dolly(0.85);
document.getElementById('zout').onclick=()=>dolly(1.18);
document.getElementById('reset').onclick=()=>{ camera.position.copy(HOME.pos); controls.target.copy(HOME.tgt); };
const rotBtn=document.getElementById('rot');
rotBtn.onclick=()=>{ controls.autoRotate=!controls.autoRotate; controls.autoRotateSpeed=1.6; rotBtn.classList.toggle('on',controls.autoRotate); };

addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
const clock=new THREE.Clock();
(function loop(){ requestAnimationFrame(loop); const dt=clock.getDelta(); if(mixer)mixer.update(dt); controls.update(); renderer.render(scene,camera); })();

// 시작: Claire (모션 있음)
loadChar(CHARS[1]);
</script>
</body>
</html>
