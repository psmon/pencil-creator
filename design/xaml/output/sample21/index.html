<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------- game data (same as Unity) ----------
const STRIP=[[0,3,1,5,2,4,6,1,3,5,0,2],[1,5,0,3,6,2,4,0,5,1,3,6],[5,2,3,0,1,6,4,3,2,0,5,1]];
const PAY=[40,12,8,16,20,25,100];
const NAME=['SEVEN','BAR','CHERRY','BELL','DIAMOND','COIN','WILD'];
const SYM=['seven','bar','cherry','bell','diamond','coin','wild'];

// ---------- renderer / scene / camera ----------
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=0.85;
renderer.outputColorSpace=THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x05060d);
scene.fog=new THREE.FogExp2(0x05060d,0.045);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,200);
// ── 화면 비율에 맞춰 콘텐츠(머신+우측 리액션 캐릭)를 항상 프레임에 담는 fit-to-aspect ──
// FRAME = 항상 보여야 할 월드 영역: x[cx±halfW], y[cy±halfH] (z~0 평면 기준)
const FRAME={cx:0.5, cy:1.72, halfW:2.55, halfH:1.98};
function fitCamera(){
  const w=Math.max(1,innerWidth), h=Math.max(1,innerHeight), aspect=w/h;
  const t=Math.tan(THREE.MathUtils.degToRad(camera.fov)/2);
  const distV=FRAME.halfH/t;              // 세로가 담기는 거리
  const distH=FRAME.halfW/(t*aspect);     // 가로가 담기는 거리
  const dist=Math.max(distV,distH)*1.06;  // 둘 중 큰 쪽 + 여유
  camera.position.set(FRAME.cx, FRAME.cy+0.05, dist+0.25);
  camera.lookAt(FRAME.cx, FRAME.cy-0.14, 0.1);
  camera.aspect=aspect; camera.updateProjectionMatrix();
}
fitCamera();

// lights
scene.add(new THREE.AmbientLight(0x334466,0.55));
const key=new THREE.SpotLight(0xfff0d8,42,25,0.6,0.5,1.2); key.position.set(-2,4.5,3.5); key.target.position.set(0,1.5,0);
scene.add(key,key.target);
const fill=new THREE.SpotLight(0x88aaff,20,25,0.7,0.5,1.2); fill.position.set(2.5,3.5,3); fill.target.position.set(0,1.4,0);
scene.add(fill,fill.target);
const rim=new THREE.PointLight(0xff4488,12,14,2); rim.position.set(0,3,-2); scene.add(rim);

// ---------- textures ----------
const loader=new THREE.TextureLoader();
const tex={}; let toLoad=SYM.length+1, loaded=0;
function onload(){ if(++loaded>=toLoad) start(); }
SYM.forEach(s=>{ tex[s]=loader.load('tex/'+s+'.jpg', onload); tex[s].colorSpace=THREE.SRGBColorSpace; });
tex.backglass=loader.load('tex/backglass.jpg', onload); tex.backglass.colorSpace=THREE.SRGBColorSpace;

// ---------- materials ----------
const gold=new THREE.MeshStandardMaterial({color:0xcaa030,metalness:1,roughness:0.28});
const dark=new THREE.MeshStandardMaterial({color:0x0a0a12,metalness:0.3,roughness:0.5});
const velvet=new THREE.MeshStandardMaterial({color:0x140306,metalness:0,roughness:0.6});
function box(w,h,d,mat,x,y,z){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); scene.add(m); return m; }

// ---------- reels ----------
const REEL_X=[-0.8,0,0.8], R=0.86, N=12, CY=1.55;
const reels=[];
class Reel{
  constructor(i){
    this.i=i; this.g=new THREE.Group(); this.g.position.set(REEL_X[i],CY,0); scene.add(this.g);
    // dark drum backing
    const drum=new THREE.Mesh(new THREE.CylinderGeometry(R*0.99,R*0.99,0.72,32,1,true), dark);
    drum.rotation.z=Math.PI/2; this.g.add(drum);
    for(let j=0;j<N;j++){
      const a=j*(2*Math.PI/N);
      const o=new THREE.Vector3(0,Math.cos(a),Math.sin(a));
      const p=new THREE.Mesh(new THREE.PlaneGeometry(0.74,0.54),
        new THREE.MeshBasicMaterial({map:tex[SYM[STRIP[i][j]]],toneMapped:false}));
      p.position.copy(o.clone().multiplyScalar(R+0.02));
      p.lookAt(o.clone().multiplyScalar(R+2)); // face outward
      this.g.add(p);
    }
    this.state=0; this.angle=0; this.vel=0; this.target=0; this.landed=0;
  }
  get spinning(){ return this.state!==0; }
  startSpin(){ this.state=1; }
  stopAt(pos){
    this.landed=pos;
    const t=Math.PI/2 - pos*(2*Math.PI/N);
    const k=Math.ceil((this.angle+Math.PI*3 - t)/(2*Math.PI));
    this.target=t+k*2*Math.PI; this.start=this.angle; this.stopT=0; this.stopDur=0.75; this.state=2;
  }
  update(dt){
    if(this.state===1){ this.vel=Math.min(this.vel+16*dt, 15); this.angle+=this.vel*dt; }
    else if(this.state===2){
      this.stopT+=dt; const k=this.stopT/this.stopDur;
      if(k>=1){ this.angle=this.target; this.state=0; this.vel=0; this.bounce=0.16; }
      else { const e=1-Math.pow(1-k,3); this.angle=this.start+(this.target-this.start)*e; }
    }
    let a=this.angle;
    if(this.bounce>0){ this.bounce-=dt; a=this.target - Math.sin(Math.max(0,this.bounce)/0.16*Math.PI)*0.09; }
    this.g.rotation.x=a;
  }
}

// ---------- cabinet / bezel / marquee ----------
let bulbs=[];
function buildCabinet(){
  // reel housing (dark) behind window
  box(2.75,1.85,0.2, new THREE.MeshStandardMaterial({color:0x02030a,roughness:0.4}), 0,1.55,-0.35);
  // pillars + marquee + console
  box(0.34,3.0,0.95, gold, -1.42,1.55,0.15);
  box(0.34,3.0,0.95, gold, 1.42,1.55,0.15);
  box(3.4,0.95,0.9, gold, 0,3.18,0.05);
  box(3.0,0.72,1.1, gold, 0,0.4,0.55).rotation.x=0.28;
  box(3.0,2.6,0.2, velvet, 0,1.55,-1.0);
  // backglass
  const bg=new THREE.Mesh(new THREE.PlaneGeometry(3.0,0.78),
    new THREE.MeshBasicMaterial({map:tex.backglass,toneMapped:false}));
  bg.position.set(0,3.18,0.52); scene.add(bg);
  // bezel frame (emissive gold)
  const be=new THREE.MeshStandardMaterial({color:0xe0b040,emissive:0x6a4500,emissiveIntensity:0.7,metalness:1,roughness:0.3});
  box(2.9,0.22,0.18, be, 0,2.45,1.0);
  box(2.9,0.22,0.18, be, 0,0.66,1.0);
  box(0.22,2.0,0.18, be, -1.34,1.55,1.0);
  box(0.22,2.0,0.18, be, 1.34,1.55,1.0);
  box(0.07,1.75,0.16, gold, -0.4,1.55,1.0);
  box(0.07,1.75,0.16, gold, 0.4,1.55,1.0);
  // payline
  const pl=new THREE.MeshStandardMaterial({color:0xff1122,emissive:0xff0010,emissiveIntensity:1.6});
  box(2.7,0.035,0.02, pl, 0,1.55,1.03);
  // spin button dome
  const btn=new THREE.Mesh(new THREE.SphereGeometry(0.22,20,14),
    new THREE.MeshStandardMaterial({color:0xd01818,emissive:0xff1020,emissiveIntensity:1.5,roughness:0.3}));
  btn.scale.set(1,0.5,1); btn.position.set(0,0.7,1.12); scene.add(btn);
  // marquee bulbs
  const bm=new THREE.MeshStandardMaterial({color:0xffe6a0,emissive:0xffcf70,emissiveIntensity:1.4});
  for(let k=0;k<22;k++){
    const b=new THREE.Mesh(new THREE.SphereGeometry(0.055,10,8), bm.clone());
    b.position.set(-1.55+k*3.1/21, 3.72, 0.5); scene.add(b); bulbs.push(b);
  }
  // dark backdrop
  box(40,16,0.3, new THREE.MeshStandardMaterial({color:0x04030a,roughness:0.5}), 0,4,-7);
  box(30,0.3,20, dark, 0,9,-1);
  box(30,0.3,20, new THREE.MeshStandardMaterial({color:0x03040a,roughness:0.7,metalness:0.3}), 0,0,0);
}

// ---------- coins (contained in reel window) ----------
const BOX={xmin:-1.08,xmax:1.08,ymin:0.8,ymax:2.3,zmin:0.74,zmax:0.98};
let coinFaceMat, coinEdgeMat, coinGeo;
const coins=[]; // {mesh, vx,vy,vz, life, absorb, tt, av}
function makeCoinMat(){
  // 3D 동전: 앞/뒷면=코인 텍스처(발광 골드), 테두리=골드 메탈
  coinFaceMat=new THREE.MeshStandardMaterial({color:0xffd24a,metalness:1,roughness:0.22,
    map:tex.coin, emissive:0xffb028, emissiveIntensity:0.7, emissiveMap:tex.coin});
  coinEdgeMat=new THREE.MeshStandardMaterial({color:0xe0a828,metalness:1,roughness:0.3,
    emissive:0x6a4400, emissiveIntensity:0.5});
  coinGeo=new THREE.CylinderGeometry(0.5,0.5,0.2,26,1); // groups: 0=side,1=top,2=bottom
}
function spawnCoin(x,y,z,size,vx,vy,vz,life,absorb){
  const m=new THREE.Mesh(coinGeo, [coinEdgeMat, coinFaceMat, coinFaceMat]);
  m.scale.setScalar(size);
  m.position.set(x,y,z);
  m.rotation.set(Math.random()*6.28, Math.random()*6.28, Math.random()*6.28);
  scene.add(m);
  // 물리형 텀블 회전(랜덤 축)
  const av=new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5)
    .normalize().multiplyScalar(12+Math.random()*14);
  coins.push({mesh:m,vx,vy,vz,life,absorb,tt:0,size:size*0.5,av});
}
function betCoins(n){
  for(let i=0;i<n;i++){
    setTimeout(()=>{ if(!alive) return;
      spawnCoin((Math.random()-0.5)*0.9, 2.2+Math.random()*0.12, 0.88+(Math.random()-0.5)*0.08,
        0.14+Math.random()*0.04, (Math.random()-0.5)*0.4, -1.9-Math.random()*0.8, 0, 0.9, true);
    }, i*38);
  }
}
function payoutCoins(amount,jackpot){
  const n=Math.min(Math.max(14,amount/2|0), jackpot?70:46);
  for(let i=0;i<n;i++){
    setTimeout(()=>{ if(!alive) return;
      const z=0.80+Math.random()*0.15, size=0.13+Math.random()*0.06;
      spawnCoin((Math.random()-0.5)*0.5, 0.9+Math.random()*0.1, z, size,
        (Math.random()-0.5)*1.2, 3.0+Math.random()*1.9, (Math.random()-0.5)*0.22, jackpot?4.2:3.4, false);
    }, i*22);
  }
}
function updateCoins(dt){
  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i]; c.tt+=dt;
    if(c.absorb && c.tt>0.3){ // suck into slot + shrink
      const sx=0, sy=0.85, sz=0.86; const k=Math.min(1,(c.tt-0.3)/0.24);
      c.mesh.position.lerp(new THREE.Vector3(sx,sy,sz), 0.18);
      c.mesh.scale.multiplyScalar(0.9);
      c.mesh.rotation.y+=12*dt;
      if(k>=1){ scene.remove(c.mesh); coins.splice(i,1); continue; }
    } else {
      c.vy-=9.8*dt;
      const p=c.mesh.position;
      p.x+=c.vx*dt; p.y+=c.vy*dt; p.z+=c.vz*dt;
      // 3D 텀블 회전 + 점진 감쇠(안착 시 서서히 정지)
      c.mesh.rotation.x+=c.av.x*dt; c.mesh.rotation.y+=c.av.y*dt; c.mesh.rotation.z+=c.av.z*dt;
      c.av.multiplyScalar(1 - 0.55*dt);
      const r=c.size;
      // 투명벽 반발 낮춤(0.28) → 덜 흩어지고 모임
      if(p.x<BOX.xmin+r){p.x=BOX.xmin+r;c.vx=Math.abs(c.vx)*0.28;} if(p.x>BOX.xmax-r){p.x=BOX.xmax-r;c.vx=-Math.abs(c.vx)*0.28;}
      if(p.z<BOX.zmin+r){p.z=BOX.zmin+r;c.vz=Math.abs(c.vz)*0.28;} if(p.z>BOX.zmax-r){p.z=BOX.zmax-r;c.vz=-Math.abs(c.vz)*0.28;}
      if(p.y>BOX.ymax-r){p.y=BOX.ymax-r;c.vy=-Math.abs(c.vy)*0.35;}
      if(p.y<BOX.ymin+r){ p.y=BOX.ymin+r; c.vy=Math.abs(c.vy)*0.26; c.vx*=0.55; c.vz*=0.55; c.av.multiplyScalar(0.55); }
    }
    if(c.life>0){ c.life-=dt; if(c.life<=0){ scene.remove(c.mesh); coins.splice(i,1); } }
  }
}

// ---------- game state ----------
let credits=1000, bet=10, win=0, spinning=false;
let dispCred=1000, dispWin=0, winFlash=0, popT=0, lastJackpot=false;
const $=id=>document.getElementById(id);

function evaluate(){
  const s=[STRIP[0][reels[0].landed],STRIP[1][reels[1].landed],STRIP[2][reels[2].landed]];
  let wilds=s.filter(x=>x===6).length;
  let nw=-1, allSame=true;
  for(const x of s){ if(x===6) continue; if(nw===-1) nw=x; else if(x!==nw) allSame=false; }
  let triple=false, sym=-1;
  if(nw===-1){ triple=true; sym=6; } else if(allSame){ triple=true; sym=nw; }
  if(triple){ win=PAY[sym]*bet; setMsg(sym===6?'★ GOLDEN JACKPOT ★':NAME[sym]+' x3', true); }
  else { const pair=wilds>=1||s[0]===s[1]||s[1]===s[2]||s[0]===s[2]; win=pair?bet*2:0; setMsg(pair?'NICE PAIR':'TRY AGAIN', pair); }
  if(win>0){ credits+=win; winFlash=triple?3.5:2.0; lastJackpot=(triple&&sym===6); popT=4.2;
    payoutCoins(win,lastJackpot); playReaction(lastJackpot); }
  refresh();
}

function spin(){
  if(spinning||credits<bet){ if(credits<bet) setMsg('NOT ENOUGH CREDITS',false); return; }
  credits-=bet; win=0; dispWin=0; popT=0; spinning=true; setMsg('BETTING…',false); refresh();
  // 1) 동전 투입(입금) 먼저 — 완료 후 릴 스핀
  const n=Math.max(6,Math.min(18,bet/6|0));
  betCoins(n);
  setTimeout(startReels, 950);   // 동전이 슬롯으로 들어간 뒤 스핀 시작
}
function startReels(){
  setMsg('GOOD LUCK!',false);
  reels.forEach(r=>r.startSpin());
  const designWin=Math.random()<0.4;
  const wSym=Math.floor(Math.random()*6);
  const pos=reels.map((r,i)=>{
    if(designWin){ const c=[]; STRIP[i].forEach((v,p)=>{ if(v===wSym||v===6) c.push(p); });
      return c.length? c[Math.floor(Math.random()*c.length)] : Math.floor(Math.random()*N); }
    return Math.floor(Math.random()*N);
  });
  let t=0.9;
  reels.forEach((r,i)=>{ setTimeout(()=>r.stopAt(pos[i]), (t+i*0.5)*1000); });
  const wait=()=>{ if(reels.some(r=>r.spinning)) return setTimeout(wait,60); setTimeout(()=>{ evaluate(); spinning=false; refresh(); },200); };
  setTimeout(wait,(t+3*0.5)*1000);
}

function setMsg(m,win){ const el=$('msg'); el.textContent=m; el.className=win?'win':''; }
function changeBet(d){ if(spinning) return; bet=Math.max(10,Math.min(200,bet+d)); refresh(); }
function refresh(){ $('vbet').textContent=bet; $('vwin').className='v'+(win>0?' hot':''); $('vwin').id='vwin';
  $('spin').disabled=spinning; $('betup').disabled=spinning; $('betdn').disabled=spinning; $('maxbet').disabled=spinning; }

$('spin').onclick=spin; $('betup').onclick=()=>changeBet(10); $('betdn').onclick=()=>changeBet(-10);
$('maxbet').onclick=()=>{ bet=200; refresh(); };
addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault();spin();} });

// ---------- reaction characters (sample19 리소스 재사용) ----------
// Win 시 영입 캐릭 중 랜덤 1인이 랜덤 모션으로 리액션. 슬롯 우측에 배치.
const REACT_CHARS=['claire'];   // Claire 한 명만 영입 — 그의 16개 모션을 랜덤 위너로
const reactors=[]; // {root,mixer,clips,action}
const reactPos=new THREE.Vector3(2.15,0,0.75);
let reactHideAt=0;
function buildReactionStage(){
  // 리액션 캐릭 전용 조명(스포트 + 정면 필 포인트)
  const rl=new THREE.SpotLight(0xfff2e0, 5, 18, 0.9, 0.4, 0.7);
  rl.position.set(reactPos.x+0.4, 3.4, reactPos.z+1.6); rl.target.position.set(reactPos.x, 1.0, reactPos.z);
  scene.add(rl, rl.target);
  const fillP=new THREE.PointLight(0xffe8c8, 4.5, 10, 1.1);   // 정면 필
  fillP.position.set(reactPos.x, 1.6, reactPos.z+1.4); scene.add(fillP);
  const fillP2=new THREE.PointLight(0x9ec0ff, 2.2, 10, 1.1);  // 측면 림
  fillP2.position.set(reactPos.x+1.1, 1.4, reactPos.z+0.3); scene.add(fillP2);
  const fillP3=new THREE.PointLight(0xffd0a0, 2.5, 9, 1.2);   // 하단 바운스
  fillP3.position.set(reactPos.x, 0.55, reactPos.z+1.1); scene.add(fillP3);
  const disc=new THREE.Mesh(new THREE.CylinderGeometry(0.7,0.7,0.04,32),
    new THREE.MeshStandardMaterial({color:0x140306,metalness:0.4,roughness:0.5,emissive:0x3a0810,emissiveIntensity:0.6}));
  disc.position.set(reactPos.x,0.02,reactPos.z); scene.add(disc);
}
function loadReactors(){
  const gl=new GLTFLoader();
  REACT_CHARS.forEach(name=>{
    gl.load('../sample19/models/'+name+'.glb', g=>{
      const inner=g.scene;  // GLB 씬은 identity 유지(스킨 바인드 보존)
      inner.traverse(o=>{ if(o.isMesh){o.frustumCulled=false; o.castShadow=false;} });
      inner.updateMatrixWorld(true);
      const box=new THREE.Box3().setFromObject(inner); const s=1.55/Math.max(0.1,box.max.y-box.min.y);
      const pivot=new THREE.Group();
      pivot.add(inner);
      pivot.scale.setScalar(s);
      pivot.position.set(reactPos.x, -box.min.y*s, reactPos.z);
      pivot.rotation.y=-0.6;
      pivot.visible=false;
      scene.add(pivot);
      const clips=(g.animations||[]);
      clips.forEach(c=>{ c.tracks=c.tracks.filter(t=>!t.name.endsWith('.position')); });
      reactors.push({root:pivot, mixer:new THREE.AnimationMixer(inner), clips, action:null, name});
    }, undefined, ()=>{ /* 로드 실패 무시 */ });
  });
}
function playReaction(jackpot){
  if(!reactors.length) return;
  reactors.forEach(r=>{ if(r.action) r.action.fadeOut(0.2); r.root.visible=false; });
  const r=reactors[Math.floor(Math.random()*reactors.length)];
  r.root.visible=true;
  if(r.clips.length){
    const clip=r.clips[Math.floor(Math.random()*r.clips.length)];
    r.action=r.mixer.clipAction(clip); r.action.reset().setLoop(THREE.LoopRepeat,Infinity).fadeIn(0.25).play();
  }
  reactHideAt=performance.now()+(jackpot?8000:6000);
}
function updateReactors(dt){
  for(const r of reactors){ if(r.root.visible) r.mixer.update(dt); }
  if(reactHideAt && performance.now()>reactHideAt){ reactHideAt=0;
    reactors.forEach(r=>{ if(r.action) r.action.fadeOut(0.4); setTimeout(()=>{r.root.visible=false;},420); });
  }
}

// ---------- post fx ----------
let composer,bloom;
function setupFX(){
  composer=new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.38,0.5,0.9);
  composer.addPass(bloom); composer.addPass(new OutputPass());
}

// ---------- loop ----------
let alive=false; const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;
  reels.forEach(r=>r.update(dt));
  updateCoins(dt);
  updateReactors(dt);
  if(winFlash>0) winFlash-=dt;
  // marquee chase
  for(let i=0;i<bulbs.length;i++){
    let k=0.7+1.3*(0.5+0.5*Math.sin(t*6-i*0.55));
    if(winFlash>0) k=1.4+3.0*(0.5+0.5*Math.sin(t*22+i));
    bulbs[i].material.emissiveIntensity=k;
  }
  // count-up
  dispCred=approach(dispCred,credits,dt); dispWin=approach(dispWin,win,dt);
  $('vcred').textContent=Math.round(dispCred); $('vwin').textContent=Math.round(dispWin);
  // win popup
  const pop=$('pop');
  if(popT>0){ popT-=dt; const p=1-popT/4.2;
    let sc = p<0.14? lerp(0.2,1.18,p/0.14) : p<0.24? lerp(1.18,1,(p-0.14)/0.1) : 1;
    const al = popT<0.6? popT/0.6 : 1;
    pop.style.opacity=al; pop.style.transform=`translate(-50%,-50%) scale(${sc})`;
    pop.querySelector('.big').textContent=(lastJackpot?'JACKPOT +':'WIN +')+Math.round(dispWin);
  } else pop.style.opacity=0;
  composer.render();
}
function approach(cur,tgt,dt){ const d=tgt-cur; if(Math.abs(d)<0.5) return tgt; return cur+d*Math.min(1,dt*4)+Math.sign(d)*Math.max(0,Math.min(Math.abs(d),120*dt)); }
function lerp(a,b,t){ return a+(b-a)*Math.max(0,Math.min(1,t)); }

function start(){
  makeCoinMat();
  buildCabinet();
  for(let i=0;i<3;i++) reels.push(new Reel(i));
  setupFX();
  buildReactionStage();
  loadReactors();   // 캐릭터는 지연 로드(슬롯은 즉시 플레이 가능)
  refresh();
  alive=true;
  $('load').style.opacity=0; setTimeout(()=>$('load').style.display='none',600);
  animate();
}

// ── 리사이즈/회전: 렌더러 리사이즈 + 카메라 재프레이밍 ──
function onResize(){
  const w=Math.max(1,innerWidth), h=Math.max(1,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(w,h); if(composer) composer.setSize(w,h);
  fitCamera();
}
addEventListener('resize', onResize);
addEventListener('orientationchange', ()=>{ setTimeout(onResize,250); setTimeout(onResize,600); });
if(window.visualViewport) visualViewport.addEventListener('resize', onResize);

// ── 전체화면(가로) 유도: 폰=풀스크린+가로락, PC=풀스크린 토글 ──
const fsBtn=document.getElementById('fs');
async function goFullscreen(){
  try{
    const el=document.documentElement;
    if(!document.fullscreenElement && el.requestFullscreen) await el.requestFullscreen({navigationUI:'hide'});
    else if(!document.fullscreenElement && el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }catch(e){}
  try{ if(screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); }catch(e){}
  setTimeout(onResize,300);
}
if(fsBtn) fsBtn.addEventListener('click', ()=>{
  if(document.fullscreenElement){ try{document.exitFullscreen();}catch(e){} }
  else goFullscreen();
});
// 첫 SPIN 터치 시(모바일) 가로 전체화면 자동 유도 — 한 번만
let fsPrompted=false;
const isTouch = matchMedia('(pointer:coarse)').matches;
function maybeAutoFullscreen(){
  if(fsPrompted || !isTouch) return; fsPrompted=true;
  if(!document.fullscreenElement) goFullscreen();
}
document.getElementById('spin').addEventListener('click', maybeAutoFullscreen, {once:false});
</script>
